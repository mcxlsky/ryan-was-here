<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- K Health: a bedside patient monitor, front on, lit from the top left — slim warm-white housing with crisp corners and two front-to-back handles, a big screen of live traces
       (two green ECG leads, cyan SpO2 pleth, yellow respiration) with readings boxed down the right, a pale control strip with oval keys
       (alarm silence in yellow) and a large trim knob. Matches the 3D model on the Featured slide. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset=".6" stop-color="#efede7"/><stop offset="1" stop-color="#dedbd2"/></linearGradient>
    <linearGradient id="shellSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".07"/><stop offset=".1" stop-color="#000" stop-opacity="0"/><stop offset=".88" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".11"/></linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfcfa"/><stop offset="1" stop-color="#d8d5cc"/></linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8ebef"/><stop offset="1" stop-color="#d2d7de"/></linearGradient>
    <radialGradient id="knob" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#d7dade"/><stop offset=".8" stop-color="#9da2a9"/><stop offset="1" stop-color="#7a7f86"/></radialGradient>
    <radialGradient id="key" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#b9c1cc"/></radialGradient>
    <radialGradient id="keyY" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#e5c24a"/></radialGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".35" stop-color="#fff" stop-opacity=".03"/><stop offset=".36" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="404" cy="684" rx="275" ry="18" fill="#000" opacity=".22" filter="url(#soft)"/>

  <!-- two handles on top, near the left and right edges, each a loop running front to back (seen a touch from above, so the opening shows) -->
  <g fill="none" stroke-linecap="round">
    <path id="hdlL" d="M176 200 V 160 Q 176 134 202 134 H 230 Q 256 134 256 160 V 200"/>
    <path id="hdlR" d="M544 200 V 160 Q 544 134 570 134 H 598 Q 624 134 624 160 V 200"/>
    <use href="#hdlL" stroke="#c9c5bb" stroke-width="30"/><use href="#hdlR" stroke="#c9c5bb" stroke-width="30"/>
    <use href="#hdlL" stroke="url(#handle)" stroke-width="25"/><use href="#hdlR" stroke="url(#handle)" stroke-width="25"/>
    <path d="M186 168 Q 186 144 206 144 H 228" stroke="#fff" stroke-width="2.5" opacity=".8"/>
    <path d="M554 168 Q 554 144 574 144 H 596" stroke="#fff" stroke-width="2.5" opacity=".8"/>
  </g>

  <!-- feet -->
  <rect x="168" y="660" width="44" height="14" rx="5" fill="#1b1b1d"/>
  <rect x="588" y="660" width="44" height="14" rx="5" fill="#1b1b1d"/>

  <!-- housing -->
  <rect x="130" y="196" width="540" height="470" rx="20" fill="url(#shell)"/>
  <rect x="130" y="196" width="540" height="470" rx="20" fill="url(#shellSide)"/>
  <path d="M152 199 H 648" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <!-- screen: dark bezel, the display, header bar -->
  <rect x="166" y="232" width="468" height="336" rx="8" fill="#27292d"/>
  <rect x="178" y="244" width="444" height="312" rx="6" fill="#05080b"/>
  <rect x="178" y="244" width="444" height="16" rx="3" fill="#1b2a3a"/>
  <g fill="#c9d4df" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" opacity=".8">
    <text x="186" y="256">BED 04  ADULT</text><text x="614" y="256" text-anchor="end">09:41</text>
  </g>

  <!-- traces (with a soft glow), and the sweep's erase gap -->
  <g fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <g filter="url(#glow)" opacity=".7">
      <path d="M190 314 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h8 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h8 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h8 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h4" stroke="#4cf08c"/>
    </g>
    <path d="M190 314 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h8 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h8 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h8 h14 q4 -6 8 0 h6 l3 5 l4 -45 l4 55 l3 -15 h8 q7 -10 14 0 h4" stroke="#4cf08c"/>
    <path d="M190 376 h14 q4 -5 8 0 h6 l3 4 l4 -34 l4 42 l3 -12 h8 q7 -8 14 0 h8 h14 q4 -5 8 0 h6 l3 4 l4 -34 l4 42 l3 -12 h8 q7 -8 14 0 h8 h14 q4 -5 8 0 h6 l3 4 l4 -34 l4 42 l3 -12 h8 q7 -8 14 0 h8 h14 q4 -5 8 0 h6 l3 4 l4 -34 l4 42 l3 -12 h8 q7 -8 14 0 h4" stroke="#4cf08c"/>
    <path d="M190 452 c 6 -2 8 -26 14 -28 c 6 -2 10 10 14 14 c 3 3 4 -4 8 -2 c 6 4 18 10 36 12 c 6 -2 8 -26 14 -28 c 6 -2 10 10 14 14 c 3 3 4 -4 8 -2 c 6 4 18 10 36 12 c 6 -2 8 -26 14 -28 c 6 -2 10 10 14 14 c 3 3 4 -4 8 -2 c 6 4 18 10 36 12 c 6 -2 8 -26 14 -28 c 6 -2 10 10 14 14 c 3 3 4 -4 8 -2 c 6 4 18 10 22 10" stroke="#46d3ff"/>
    <path d="M190 518 q 30 -26 60 0 t 60 0 t 60 0 t 60 0 t 50 0" stroke="#ffd84a"/>
  </g>
  <rect x="392" y="264" width="10" height="288" fill="#05080b"/>

  <!-- the readings, boxed down the right -->
  <g fill="none" stroke="#a0b4c8" stroke-opacity=".35" stroke-width="1.5">
    <rect x="482" y="266" width="134" height="286"/>
    <path d="M482 336 H 616 M482 398 H 616 M482 458 H 616 M482 508 H 616"/>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700">
    <text x="490" y="280" font-size="9" fill="#4cf08c" font-weight="600">HR bpm</text>
    <text x="608" y="328" font-size="52" fill="#4cf08c" text-anchor="end">60</text>
    <text x="490" y="350" font-size="9" fill="#f2f4f7" font-weight="600">NIBP mmHg</text>
    <text x="608" y="380" font-size="26" fill="#f2f4f7" text-anchor="end">108/70</text>
    <text x="490" y="392" font-size="12" fill="#c9d0d8" font-weight="600">(84)</text>
    <text x="490" y="412" font-size="9" fill="#46d3ff" font-weight="600">SpO₂ %</text>
    <text x="608" y="452" font-size="40" fill="#46d3ff" text-anchor="end">98</text>
    <text x="490" y="472" font-size="9" fill="#ffd84a" font-weight="600">RR rpm</text>
    <text x="608" y="502" font-size="30" fill="#ffd84a" text-anchor="end">20</text>
    <text x="490" y="522" font-size="9" fill="#f2f4f7" font-weight="600">TEMP °F</text>
    <text x="608" y="546" font-size="22" fill="#f2f4f7" text-anchor="end">99.8</text>
  </g>
  <rect x="178" y="244" width="444" height="312" rx="6" fill="url(#glassShine)"/>

  <!-- control strip: status LEDs, oval keys (alarm silence in yellow), the trim knob -->
  <rect x="170" y="590" width="380" height="50" rx="25" fill="url(#strip)"/>
  <rect x="170" y="590" width="380" height="50" rx="25" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="1.5"/>
  <circle cx="196" cy="606" r="4" fill="#4cf08c"/><circle cx="196" cy="624" r="4" fill="#ffb347"/>
  <ellipse cx="248" cy="615" rx="24" ry="11" fill="url(#key)"/>
  <ellipse cx="310" cy="615" rx="24" ry="11" fill="url(#key)"/>
  <ellipse cx="372" cy="615" rx="24" ry="11" fill="url(#key)"/>
  <ellipse cx="434" cy="615" rx="24" ry="11" fill="url(#keyY)"/>
  <circle cx="598" cy="615" r="32" fill="#27292d"/>
  <circle cx="598" cy="615" r="26" fill="url(#knob)"/>
  <circle cx="598" cy="615" r="20" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
