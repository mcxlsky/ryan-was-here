<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Hush: a martini, front on, lit from the top left — clear glass, a pale drink, an olive with an orange pimento on a charcoal pick -->
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea" stop-opacity=".75"/><stop offset=".22" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".7" stop-color="#e9eef1" stop-opacity=".25"/><stop offset="1" stop-color="#c7d0d6" stop-opacity=".7"/></linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efcf"/><stop offset="1" stop-color="#d9d29e"/></linearGradient>
    <linearGradient id="drinkSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9b277" stop-opacity=".55"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#a9a26a" stop-opacity=".5"/></linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bcc5cb"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".7" stop-color="#dfe5e9"/><stop offset="1" stop-color="#a9b3ba"/></linearGradient>
    <radialGradient id="foot" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".7" stop-color="#e3e9ec" stop-opacity=".7"/><stop offset="1" stop-color="#b9c3c9" stop-opacity=".85"/></radialGradient>
    <radialGradient id="olive" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#c9d36a"/><stop offset=".5" stop-color="#8d9a2c"/><stop offset="1" stop-color="#55601a"/></radialGradient>
    <radialGradient id="orange" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffa070"/><stop offset=".5" stop-color="#ef6a35"/><stop offset="1" stop-color="#b9421a"/></radialGradient>
    <linearGradient id="pick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a4e"/><stop offset="1" stop-color="#151516"/></linearGradient>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="liquid"><path d="M262 262 H538 L400 448 Z"/></clipPath>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="404" cy="660" rx="150" ry="14" fill="#000" opacity=".2" filter="url(#soft)"/>

  <!-- foot and stem -->
  <ellipse cx="400" cy="648" rx="118" ry="20" fill="url(#foot)"/>
  <ellipse cx="400" cy="648" rx="118" ry="20" fill="none" stroke="#9aa5ad" stroke-opacity=".7" stroke-width="2"/>
  <ellipse cx="380" cy="642" rx="60" ry="6" fill="#fff" opacity=".8"/>
  <path d="M394 456 C 396 520, 394 600, 386 636 H414 C 406 600, 404 520, 406 456 Z" fill="url(#stem)"/>
  <path d="M394 456 C 396 520, 394 600, 386 636 H414 C 406 600, 404 520, 406 456 Z" fill="none" stroke="#9aa5ad" stroke-opacity=".6" stroke-width="1.5"/>

  <!-- the drink, inside the cone -->
  <g clip-path="url(#liquid)">
    <rect x="250" y="250" width="300" height="210" fill="url(#drink)"/>
    <rect x="250" y="250" width="300" height="210" fill="url(#drinkSide)"/>
  </g>
  <ellipse cx="400" cy="263" rx="138" ry="13" fill="#fbf8e6"/>
  <ellipse cx="400" cy="263" rx="138" ry="13" fill="none" stroke="#c7bf86" stroke-opacity=".7" stroke-width="1.5"/>

  <!-- pick and olive (the pick crosses the rim, the olive sits in the drink) -->
  <line x1="284" y1="196" x2="436" y2="388" stroke="url(#pick)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="281" cy="192" r="9" fill="url(#pick)"/>
  <ellipse cx="402" cy="346" rx="31" ry="27" fill="url(#olive)" transform="rotate(38 402 346)"/>
  <circle cx="416" cy="360" r="9" fill="url(#orange)"/>
  <ellipse cx="392" cy="334" rx="10" ry="6" fill="#fff" opacity=".45" transform="rotate(-30 392 334)"/>

  <!-- the glass bowl over everything: a faint body, edges, and white glints -->
  <path d="M228 226 H572 L406 456 H394 Z" fill="url(#bowl)"/>
  <path d="M228 226 L394 456 M572 226 L406 456" stroke="#9aa5ad" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="400" cy="226" rx="172" ry="18" fill="none" stroke="#a9b3ba" stroke-opacity=".9" stroke-width="3"/>
  <ellipse cx="400" cy="226" rx="172" ry="18" fill="#fff" fill-opacity=".18"/>
  <path d="M262 240 L380 404" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  <path d="M282 238 L330 304" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <path d="M248 219 Q 300 210 352 209" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9" fill="none"/>
</svg>
