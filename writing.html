<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Writing — ryan was here</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="bnav.css" />
  <style>
    :root { --font-ui: -apple-system, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; }
    body { min-height: 100vh; min-height: 100dvh; background: linear-gradient(180deg, #efeee9 0%, #f7f6f3 28%, #f9f9f7 60%, #efeee9 100%) fixed; color: #111;
           font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid #111; outline-offset: 3px; }

    .top { position: fixed; z-index: 2; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px; pointer-events: none; }
    .top > * { pointer-events: auto; }
    .brand { font: 600 17px/1 var(--font-ui); letter-spacing: -0.01em; }
    .brand { font-family: "Caveat", "Segoe Script", "Bradley Hand", "Snell Roundhand", cursive; font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0; }
    .x { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 10px; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(17,17,17,0.08); transition: background .15s; }
    .x:hover { background: rgba(17,17,17,0.14); }
    .x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    main { max-width: 760px; margin: 0 auto; padding: calc(clamp(96px, 16vh, 150px) + env(safe-area-inset-top, 0px)) 24px calc(120px + env(safe-area-inset-bottom, 0px)); }
    h1 { font: 600 clamp(34px, 6vw, 56px)/1.05 var(--font-ui); letter-spacing: -0.03em; }
    .lede { margin-top: 14px; font: 400 clamp(16px, 2.1vw, 19px)/1.5 var(--font-ui); color: rgba(17,17,17,0.6); }
    .lede a { color: #111; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(17,17,17,0.3); }

    .posts { margin-top: 40px; border-top: 1px solid rgba(0,0,0,0.1); }
    .post { display: flex; align-items: center; gap: 20px; padding: 24px 0; border-bottom: 1px solid rgba(0,0,0,0.1); transition: opacity .15s; }
    .posts:hover .post { opacity: 0.4; } .posts:hover .post:hover, .posts:hover .post:focus-visible { opacity: 1; }
    .post-t { flex: 1; min-width: 0; display: grid; gap: 6px; }
    .post-t b { font: 600 clamp(19px, 2.6vw, 24px)/1.2 var(--font-ui); letter-spacing: -0.02em; text-wrap: balance; }
    .post-t p { font: 400 15px/1.45 var(--font-ui); color: rgba(17,17,17,0.6); text-wrap: pretty; }
    .post-t time { font: 500 12.5px/1 var(--font-ui); letter-spacing: 0.04em; text-transform: uppercase; color: rgba(17,17,17,0.4); }
    .post-a { flex: none; color: rgba(17,17,17,0.25); transition: color .2s, transform .2s; }
    .post:hover .post-a { color: rgba(17,17,17,0.6); transform: translateX(4px); }
    .post-a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .note { padding: 28px 0; font: 400 15px/1.5 var(--font-ui); color: rgba(17,17,17,0.55); }
    .skel { height: 92px; border-bottom: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
    .skel i { display: block; height: 12px; border-radius: 6px; background: rgba(17,17,17,0.07); }
    .skel i:first-child { width: 58%; height: 16px; } .skel i:last-child { width: 34%; }
    @media (prefers-reduced-motion: reduce) { .post, .post-a { transition: none; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="ryan was here — home">ryan was here</a>
    <a class="x" href="index.html#platform" aria-label="Back to the station"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></a>
  </header>

  <main>
    <h1>Writing</h1>
    <p class="lede">Notes on design, code and whatever else I'm chewing on. It all lives on <a href="https://ryanwashere.substack.com" target="_blank" rel="noopener">Substack</a>.</p>
    <div class="posts" id="posts" aria-live="polite" aria-busy="true">
      <div class="skel" aria-hidden="true"><i></i><i></i></div>
      <div class="skel" aria-hidden="true"><i></i><i></i></div>
      <div class="skel" aria-hidden="true"><i></i><i></i></div>
    </div>
  </main>

  <script>
    /* the Substack feed has no CORS headers, so it comes through the Cloudflare Worker; the last good response is cached so a hiccup doesn't empty the page */
    (async function(){
      var PROXY='https://ryan-was-here.mcxlsky.workers.dev', KEY='substack-feed-cache', box=document.getElementById('posts');
      var esc=function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
      var xml=null;
      for (var n=1;n<=2 && !xml;n++){
        try { var res=await fetch(PROXY,{ cache:'no-store' }); if (res.ok) xml=await res.text(); }
        catch(e){}
        if (!xml && n<2) await new Promise(function(r){ setTimeout(r,1500); });
      }
      if (!xml){ try { xml=localStorage.getItem(KEY); } catch(e){} }
      var items=[];
      if (xml){ var doc=new DOMParser().parseFromString(xml,'text/xml'); if (!doc.querySelector('parsererror')){ items=Array.prototype.slice.call(doc.querySelectorAll('item')).slice(0,20); try { localStorage.setItem(KEY,xml); } catch(e){} } }
      box.setAttribute('aria-busy','false');
      if (!items.length){ box.innerHTML='<p class="note">Couldn’t load the posts just now. You can read everything at <a href="https://ryanwashere.substack.com" target="_blank" rel="noopener" style="text-decoration:underline">ryanwashere.substack.com</a>.</p>'; return; }
      box.innerHTML=items.map(function(it){
        var q=function(s){ var e=it.querySelector(s); return e?e.textContent:''; };
        var title=q('title').trim(), link=(q('link')||q('guid')).trim(), sub=q('description').replace(/<[^>]+>/g,'').trim(), raw=q('pubDate');
        var date=raw?new Date(raw).toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' }):'';
        return '<a class="post" href="'+esc(link)+'" target="_blank" rel="noopener"><span class="post-t"><b>'+esc(title)+'</b>'+(sub?'<p>'+esc(sub)+'</p>':'')+(date?'<time>'+esc(date)+'</time>':'')+'</span>'+
          '<span class="post-a" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span></a>';
      }).join('');
    })();
  </script>
  <script src="bnav.js" data-current="writing" defer></script>
</body>
</html>
