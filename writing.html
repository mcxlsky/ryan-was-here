<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ryan McCaulsky</title>
  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png?v=3" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="bnav.css" />
  <style>
    :root { --font-ui: -apple-system, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; }
    body { min-height: 100vh; min-height: 100dvh; background: #FAFAFA; color: #111;
           font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid #111; outline-offset: 3px; }

    /* header, as on the About page: the faint wordmark centred on a fade that lets the list scroll away under it, and a bare X on the right */
    .top { --edge: max(0px, (100vw - 1280px) / 2); position: fixed; z-index: 2; top: 0; left: 0; right: 0; display: flex; justify-content: center; padding: calc(31px + env(safe-area-inset-top, 0px)) 40px 39px; pointer-events: none;
           background: linear-gradient(#FAFAFA 62%, rgba(250,250,250,0)); }
    .top > * { pointer-events: auto; }
    .brand { font: 700 26px/1 "Caveat", "Segoe Script", "Bradley Hand", "Snell Roundhand", cursive; color: rgba(17,17,17,0.22); border-radius: 4px; transition: color .2s; }
    .brand:hover { color: rgba(17,17,17,0.45); }
    .x { position: absolute; top: calc(24px + env(safe-area-inset-top, 0px)); right: calc(10px + var(--edge)); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: rgba(17,17,17,0.35); transition: color .2s; }
    .x:hover { color: rgba(17,17,17,0.6); }
    .x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    main { max-width: 760px; margin: 0 auto; padding: calc(clamp(96px, 16vh, 150px) + env(safe-area-inset-top, 0px)) 24px 96px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* the page title, for screen readers only */
    .lede { font: 400 clamp(16px, 2.1vw, 19px)/1.5 var(--font-ui); color: rgba(17,17,17,0.6); text-align: center; text-wrap: balance; }

    /* posts: a grid of cards, each led by the article's Substack image (cropped to 4:5, which suits the portrait photos), then the title, subtitle and date */
    .posts { margin-top: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .post { display: flex; flex-direction: column; border-radius: 16px; background: #fff; overflow: hidden;
            box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 0 0 1px rgba(17,17,17,0.06); transition: box-shadow .25s, transform .25s cubic-bezier(.2,.8,.2,1); }
    .post:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px rgba(17,17,17,0.28), 0 0 0 1px rgba(17,17,17,0.08); }
    .post:focus-visible { outline-offset: 4px; }
    .post-img { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: rgba(17,17,17,0.06); }
    .post-img img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
    .post:hover .post-img img { transform: scale(1.03); }
    .post-t { display: grid; gap: 6px; padding: 18px 20px 20px; }
    .post-t b { font: 600 clamp(18px, 2.2vw, 21px)/1.22 var(--font-ui); letter-spacing: -0.02em; text-wrap: balance; }
    .post-t p { font: 400 15px/1.45 var(--font-ui); color: rgba(17,17,17,0.6); text-wrap: pretty; }
    .post-t time { margin-top: 4px; font: 500 12.5px/1 var(--font-ui); letter-spacing: 0.04em; text-transform: uppercase; color: rgba(17,17,17,0.4); }
    .note { grid-column: 1 / -1; padding: 28px 0; font: 400 15px/1.5 var(--font-ui); color: rgba(17,17,17,0.55); }
    .skel { border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(17,17,17,0.06); overflow: hidden; }
    .skel::before { content: ''; display: block; aspect-ratio: 4 / 5; background: rgba(17,17,17,0.06); }
    .skel i { display: block; height: 12px; margin: 0 20px 10px; border-radius: 6px; background: rgba(17,17,17,0.07); }
    .skel i:first-child { width: 62%; height: 16px; margin-top: 20px; } .skel i:last-child { width: 38%; margin-bottom: 22px; }
    @media (max-width: 600px) { .posts { grid-template-columns: 1fr; gap: 16px; } .post-img, .skel::before { aspect-ratio: 4 / 3; } }   /* one column on phones: a shorter crop so a card fits on screen */
    @media (prefers-reduced-motion: reduce) { .post, .post-img img { transition: none; } .post:hover { transform: none; } .post:hover .post-img img { transform: none; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="ryan was here — home">ryan was here</a>
    <a class="x" href="index.html#platform" aria-label="Back to the station"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></a>
  </header>

  <main>
    <h1 class="sr">Writing</h1>
    <p class="lede">Maybe I’m overthinking, but at least I’m thinking. Right?</p>
    <div class="posts" id="posts" aria-live="polite" aria-busy="true">
      <div class="skel" aria-hidden="true"><i></i><i></i></div>
      <div class="skel" aria-hidden="true"><i></i><i></i></div>
    </div>
  </main>

  <script>
    /* the Substack feed has no CORS headers, so it comes through the Cloudflare Worker; the last good response is cached so a hiccup doesn't empty the page */
    (async function(){
      var PROXY='https://ryan-was-here.mcxlsky.workers.dev', KEY='substack-feed-cache', box=document.getElementById('posts');
      var esc=function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
      var xml=null;
      for (var n=1;n<=2 && !xml;n++){
        try { var res=await fetch(PROXY,{ cache:'no-store' }); if (res.ok) xml=await res.text(); }
        catch(e){}
        if (!xml && n<2) await new Promise(function(r){ setTimeout(r,1500); });
      }
      if (!xml){ try { xml=localStorage.getItem(KEY); } catch(e){} }
      var items=[];
      if (xml){ var doc=new DOMParser().parseFromString(xml,'text/xml'); if (!doc.querySelector('parsererror')){ items=Array.prototype.slice.call(doc.querySelectorAll('item')).slice(0,20); try { localStorage.setItem(KEY,xml); } catch(e){} } }
      box.setAttribute('aria-busy','false');
      if (!items.length){ box.innerHTML='<p class="note">Couldn’t load the posts just now. You can read everything at <a href="https://ryanwashere.substack.com" target="_blank" rel="noopener" style="text-decoration:underline">ryanwashere.substack.com</a>.</p>'; return; }
      // the article image is the feed's enclosure; it's served through Substack's image CDN at 800px wide instead of the multi-megabyte original
      var img=function(u){ if (!u) return ''; var m=u.match(/\/(https?%3A%2F%2F.*)$/i), o=m?decodeURIComponent(m[1]):u;
        return 'https://substackcdn.com/image/fetch/w_800,c_limit,f_auto,q_auto:good,fl_progressive:steep/'+encodeURIComponent(o); };
      box.innerHTML=items.map(function(it){
        var q=function(s){ var e=it.querySelector(s); return e?e.textContent:''; }, en=it.querySelector('enclosure'), pic=img(en && /^image\//.test(en.getAttribute('type')||'image/') ? en.getAttribute('url') : '');
        var title=q('title').trim(), link=(q('link')||q('guid')).trim(), sub=q('description').replace(/<[^>]+>/g,'').trim(), raw=q('pubDate');
        var date=raw?new Date(raw).toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' }):'';
        return '<a class="post" href="'+esc(link)+'" target="_blank" rel="noopener">'+(pic?'<span class="post-img"><img src="'+esc(pic)+'" alt="" width="800" height="1000" loading="lazy" decoding="async"></span>':'')+
          '<span class="post-t"><b>'+esc(title)+'</b>'+(sub?'<p>'+esc(sub)+'</p>':'')+(date?'<time>'+esc(date)+'</time>':'')+'</span></a>';
      }).join('');
    })();
  </script>
  <script src="bnav.js" data-current="writing" defer></script>
</body>
</html>
