<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ryan was here — test</title>
  <meta name="description" content="Subway-doors hero (static frame — step 1)." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #171715;
      --accent: #e5ab00;
      --ink: #ffffff;
      --glass: rgba(127, 124, 117, 0.25);
      --strip: rgba(255, 255, 255, 0.45);
      --font-ui: -apple-system, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Hero shell ---------- */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 640px;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    /* Full-bleed photo of the closed doors */
    .hero__photo {
      position: absolute;
      inset: 0;
      background-image: url("assets/subway-doors.webp");
      background-size: cover;
      background-position: center 42%;
      z-index: 0;
    }

    /* Scrim so the white UI reads over the gritty photo */
    .hero__scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(15,15,14,0.55) 0%, rgba(15,15,14,0.20) 26%, rgba(15,15,14,0.28) 62%, rgba(15,15,14,0.62) 100%),
        radial-gradient(90% 60% at 50% 52%, rgba(15,15,14,0.10) 0%, rgba(15,15,14,0.45) 100%);
    }

    /* Content column, matching the Figma 1124 wrapper w/ 24px inset */
    .hero__wrap {
      position: relative;
      z-index: 2;
      height: 100%;
      max-width: 1124px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Glass wayfinding navbar ---------- */
    .navbar {
      backdrop-filter: blur(21px);
      -webkit-backdrop-filter: blur(21px);
      background: var(--glass);
      border-radius: 10px;
      box-shadow: 0 18px 36px -10px rgba(0,0,0,0.3);
      overflow: hidden;
      width: 100%;
      flex-shrink: 0;
    }

    .sign-content {
      display: flex;
      align-items: stretch;
      height: 132px;
      padding-bottom: 4px;
      overflow: hidden;
    }

    .home { display: flex; align-items: center; justify-content: center; padding: 0 40px; }
    .logo-r {
      background: var(--accent);
      color: var(--bg);
      width: 84px; height: 84px;
      border-radius: 128px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 46px; line-height: 1;
      user-select: none;
    }

    /* Angled subway-signage nav */
    .nav-strip { flex: 1; display: flex; align-items: flex-end; padding: 0 18px; overflow: hidden; }
    .nav-stops { display: flex; align-items: flex-end; height: 100%; }
    .nav-slot {
      width: 92px; height: 100%;
      display: flex; align-items: center; justify-content: center;
      margin-right: -34px;
    }
    .nav-stop {
      transform: rotate(-58deg);
      width: 150px;
      border-bottom: 1px solid var(--ink);
      padding: 17px 14px 14px 0;
      color: var(--ink);
      font-size: 17px; letter-spacing: -0.36px;
      white-space: nowrap; opacity: 0.25;
      transition: opacity 0.3s ease;
      background: none; text-align: left; cursor: pointer;
    }
    .nav-slot:first-child .nav-stop { opacity: 1; }
    .nav-slot:hover .nav-stop { opacity: 0.9; }

    /* Service strip + station dot */
    .service { position: relative; height: 26px; display: flex; align-items: center; padding: 0 28px; }
    .service-line { height: 2px; width: 100%; background: var(--strip); border-radius: 4px; }
    .station-dot {
      position: absolute; top: 50%; left: 6%;
      width: 12px; height: 12px; border-radius: 72px;
      background: #fff; border: 1px solid #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255,255,255,0.6);
    }

    /* ---------- Hero copy ---------- */
    .hero__center {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; text-align: center;
      padding: 0 24px 96px;
    }

    .tag {
      width: 190px;
      height: auto;
      transform: rotate(-3deg);
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.7));
      user-select: none;
    }

    .bio {
      max-width: 524px; font-size: 18px; font-weight: 500; line-height: 1.45;
      color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,0.75);
    }

    .btn-more {
      background: var(--accent); color: var(--bg);
      border: 1px solid var(--accent); border-radius: 52px;
      padding: 10px 26px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px -8px rgba(229,171,0,0.6);
    }
    .btn-more:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -8px rgba(229,171,0,0.85); }
    .btn-more:active { transform: translateY(0); }

    .badge {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font-size: 11px; letter-spacing: 0.08em; color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(6px);
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .sign-content { height: 92px; }
      .home { padding: 0 16px; }
      .logo-r { width: 56px; height: 56px; font-size: 30px; }
      .nav-slot { width: 62px; margin-right: -26px; }
      .nav-stop { width: 118px; font-size: 13px; }
      .hero__photo { background-position: center 45%; }
      .tag { width: 140px; }
      .bio { font-size: 15px; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__photo" role="img" aria-label="Closed New York City subway car doors"></div>
    <div class="hero__scrim"></div>

    <div class="hero__wrap">
      <!-- Glass wayfinding navbar -->
      <nav class="navbar" aria-label="Primary">
        <div class="sign-content">
          <div class="home"><div class="logo-r" aria-label="Ryan — home">R</div></div>
          <div class="nav-strip">
            <div class="nav-stops">
              <div class="nav-slot"><button class="nav-stop">About</button></div>
              <div class="nav-slot"><button class="nav-stop">Work</button></div>
              <div class="nav-slot"><button class="nav-stop">Process</button></div>
              <div class="nav-slot"><button class="nav-stop">Field notes</button></div>
              <div class="nav-slot"><button class="nav-stop">Contact</button></div>
            </div>
          </div>
          <div style="width:200px"></div>
        </div>
        <div class="service">
          <div class="service-line"></div>
          <div class="station-dot"></div>
        </div>
      </nav>

      <!-- Hero copy -->
      <div class="hero__center">
        <img class="tag" src="assets/ryan-was-here.png" alt="Ryan was here" />
        <p class="bio">
          I&rsquo;m Ryan McCaulsky, a Designer with over eight years of experience in
          human-computer interaction, design systems, and software design for consumer
          and SaaS products.
        </p>
        <button class="btn-more">More&nbsp;&rarr;</button>
      </div>
    </div>
  </section>

  <div class="badge">/test · static hero (step 1)</div>
</body>
</html>
