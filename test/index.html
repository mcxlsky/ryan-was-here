<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ryan was here — test</title>
  <meta name="description" content="Scroll-driven subway arrival hero — a live 3D R142 pulls into the station." />

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #171715;
      --accent: #e5ab00;
      --ink: #ffffff;
      --glass: rgba(127, 124, 117, 0.25);
      --strip: rgba(255, 255, 255, 0.45);
      --font-ui: -apple-system, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Scroll scene ---------- */
    .scene  { position: relative; height: 560vh; }
    .sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; background: #000; }

    /* video stage we scale slightly on scroll */
    .stage { position: absolute; inset: 0; will-change: transform, opacity; }
    .hero-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block; background: #000;
    }


    /* ---------- Overlay UI ---------- */
    .wrap {
      position: absolute; inset: 0; z-index: 5;
      height: 100%; max-width: 1124px; margin: 0 auto;
      padding: 24px; display: flex; flex-direction: column;
    }

    .navbar {
      backdrop-filter: blur(21px); -webkit-backdrop-filter: blur(21px);
      background: var(--glass); border-radius: 10px;
      box-shadow: 0 18px 36px -10px rgba(0,0,0,0.3);
      overflow: hidden; width: 100%; flex-shrink: 0;
      will-change: opacity;
    }
    .sign-content { display: flex; align-items: stretch; height: 132px; padding-bottom: 4px; overflow: hidden; }
    .home { display: flex; align-items: center; justify-content: center; padding: 0 40px; }
    .logo-r {
      background: var(--accent); color: var(--bg);
      width: 84px; height: 84px; border-radius: 128px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 46px; line-height: 1; user-select: none;
    }
    .nav-strip { flex: 1; display: flex; align-items: flex-end; padding: 0 18px; overflow: hidden; }
    .nav-stops { display: flex; align-items: flex-end; height: 100%; }
    .nav-slot { width: 92px; height: 100%; display: flex; align-items: center; justify-content: center; margin-right: -34px; }
    .nav-stop {
      -webkit-appearance: none; appearance: none;
      transform: rotate(-58deg); width: 150px;
      border: 0; border-bottom: 1px solid var(--ink);
      padding: 17px 14px 14px 0; color: var(--ink);
      font-size: 17px; font-weight: 700; letter-spacing: -0.36px; white-space: nowrap;
      opacity: 0.25; transition: opacity 0.3s ease;
      background: none; text-align: left; cursor: pointer;
    }
    .nav-slot:first-child .nav-stop { opacity: 1; }
    .nav-slot:hover .nav-stop { opacity: 0.9; }
    .service { position: relative; height: 26px; display: flex; align-items: center; padding: 0 28px; }
    .service-line { height: 2px; width: 100%; background: var(--strip); border-radius: 4px; }
    .station-dot {
      position: absolute; top: 50%; left: 6%;
      width: 12px; height: 12px; border-radius: 72px;
      background: #fff; border: 1px solid #fff;
      transform: translate(-50%, -50%); box-shadow: 0 0 12px rgba(255,255,255,0.6);
    }

    .center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 0 24px 96px;
      will-change: opacity, transform;
    }
    /* inner group that drops in on page load */
    .drop {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      animation: dropIn 0.95s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      animation-delay: 0.15s;
    }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-54px); }
      to   { opacity: 1; transform: none; }
    }
    /* navbar is centered on screen at rest, docks to top on scroll (driven by JS) */
    .navbar { will-change: opacity, transform; }
    .tag {
      width: 132px; height: auto; transform: rotate(-3deg);
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.7)); user-select: none;
    }
    .bio {
      max-width: 524px; font-size: 18px; font-weight: 500; line-height: 1.45;
      color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,0.8);
    }
    .btn-more {
      background: var(--accent); color: var(--bg);
      border: 1px solid var(--accent); border-radius: 52px;
      padding: 10px 26px; font-size: 20px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s ease;
      box-shadow: none;
    }
    .btn-more:hover { transform: translateY(-2px); box-shadow: none; }

    .scroll-hint {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.65); will-change: opacity;
    }
    .scroll-hint .chev {
      width: 16px; height: 16px;
      border-right: 2px solid rgba(255,255,255,0.65);
      border-bottom: 2px solid rgba(255,255,255,0.65);
      transform: rotate(45deg); animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob { 0%,100%{ transform: rotate(45deg) translate(0,0);} 50%{ transform: rotate(45deg) translate(3px,3px);} }


    /* loading veil until the clip can play/seek */
    .wx { position: absolute; left: 16px; bottom: 16px; z-index: 6; pointer-events: none;
      font: 500 12px/1.3 var(--font-ui); letter-spacing: 0.02em; color: rgba(255,255,255,0.82);
      background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
      padding: 6px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      opacity: 0; transition: opacity .6s ease; }
    .wx.on { opacity: 1; }
    .veil { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; background: #000; transition: opacity .6s ease; }
    .veil.hide { opacity: 0; pointer-events: none; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.18); border-top-color: var(--accent); animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .after { background: var(--bg); padding: 120px 24px 160px; text-align: center; }
    .after h3 { font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .after p { max-width: 620px; margin: 0 auto; color: rgba(255,255,255,0.7); font-size: 16px; line-height: 1.6; }

    .badge {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font-size: 11px; letter-spacing: 0.08em; color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(6px); pointer-events: none;
    }

    @media (max-width: 720px) {
      .sign-content { height: 92px; }
      .home { padding: 0 16px; }
      .logo-r { width: 56px; height: 56px; font-size: 30px; }
      .nav-slot { width: 62px; margin-right: -26px; }
      .nav-stop { width: 118px; font-size: 13px; }
      .tag { width: 100px; }
      .bio { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { .chev, .drop { animation: none; } }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="sticky">
      <div class="stage" id="stage">
        <canvas class="hero-canvas" id="trainCanvas" aria-label="A New York City R142 subway train pulling into the station"></canvas>
      </div>



      <div class="wx" id="wx" aria-live="polite"></div>
      <div class="veil" id="veil"><div class="spinner"></div></div>
    </div>
  </main>

  <section class="after">
    <h3>Next stop</h3>
    <p>The train runs until you scroll; then it pulls into the station and the doors open.
       The rest of the portfolio picks up from here.</p>
  </section>

  <script>
    (function () {
      /* scroll zones (fraction of the pinned scene) — the train script uses the same ones */
      var SCRUB_TO = 0.82;

      var reduce  = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var scene   = document.getElementById('scene');
      var stage   = document.getElementById('stage');
      var veil    = document.getElementById('veil');

      var clamp  = function (v,a,b){ return v<a?a:(v>b?b:v); };
      var smooth = function (a,b,x){ var t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

      function progress(){
        var total = scene.offsetHeight - window.innerHeight;
        if (total <= 0) return 0;
        return clamp(-scene.getBoundingClientRect().top / total, 0, 1);
      }

      var ready = false;
      function frame(){
        if (!ready && window.__ready){
          ready = true;
          veil.classList.add('hide');        // loading veil fades out once the train is built
        }
        var p = progress();

        // gentle scale + fade of the scene near the end
        var vfade = 1 - smooth(SCRUB_TO + 0.05, 1.0, p);
        stage.style.opacity = vfade.toFixed(3);
        stage.style.transform = 'scale(' + (1 + 0.06 * clamp(p/SCRUB_TO,0,1)).toFixed(4) + ')';

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
  <script src="train-data.js"></script>
  <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
// every colour in this scene was tuned under r128 (hex values used as-is, legacy light units) — keep that look
THREE.ColorManagement.enabled = false;
(function () {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('trainCanvas');
  const host = document.getElementById('stage');
  const vw = ()=>host.clientWidth||innerWidth, vh = ()=>host.clientHeight||innerHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(vw(), vh(), false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.useLegacyLights = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.60;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  /* atmosphere: backdrop, the floor it sweeps into, the tint of what the steel reflects, and the ties */
  const GOLD = 0xdcae3b;                                   // the logo's gold
  const THEMES = {
    black:  { bg:0x0b0b0c, floor:0x111113, refl:0xc4c8cf, tint:[1.0,1.0,1.0],  ties:0x3a3a3c, portal:0x1b1b1e, station:0xe2e0da, platform:0x6c6b67, edge:0xd6d5d0, lamp:0xf4f1ea },  // neutral: white-tile station, concrete platform
    gold:   { bg:GOLD,     floor:0xd8a835, refl:0xf0dcae, tint:[1.0,0.78,0.36], ties:0xa07c22, portal:0xd8a835, station:GOLD, platform:0xd8a835, edge:0xf3e2a0, lamp:0xffd27a },
    ochre:  { bg:0xd6941a, floor:0xc98a18, refl:0xecc98a, tint:[1.0,0.68,0.26], ties:0x86601a, portal:0xc98a18, station:0xd6941a, platform:0xc98a18, edge:0xf3e2a0, lamp:0xffd27a },
    butter: { bg:0xedd27c, floor:0xe8cb70, refl:0xf6ead0, tint:[1.0,0.88,0.56], ties:0xbfa04e, portal:0xe8cb70, station:0xedd27c, platform:0xe8cb70, edge:0xf3e2a0, lamp:0xffd27a },
  };
  const THEME = THEMES[new URLSearchParams(location.search).get('theme')] || THEMES.black;
  /* tunnel mouth at x0, station platform st0..st1, car 1 comes to rest centred at STOP_X (inside the station) */
  const TUNNEL = { x0:180, x1:430, z0:-3.2, z1:4.8, top:3.4, st0:248, st1:312 };
  /* grade: street level outside, an eased ramp down an open cut (like the Bronx portal by 3 Av–149 St), level underground.
     gradeY(x) is the track's height above its underground level at x. */
  /* the line near 3 Av–149 St (from Google 3D references): elevated steel over the avenue, down a ramp — steel, then a
     walled embankment, then an open cut below the street — into a portal at the edge of a plaza by the Hub.
     Heights are above the underground track level: the street is 6.2 m up (over the tunnel roof), the elevated deck 5 m above that. */
  const STREET = 6.2, GRADE = { a:-10, b:TUNNEL.x0-2, h:STREET+5.0 };
  const gradeY = x => x<=GRADE.a ? GRADE.h : x>=GRADE.b ? 0 : GRADE.h*(1+Math.cos(Math.PI*(x-GRADE.a)/(GRADE.b-GRADE.a)))/2;
  const gradeX = y => GRADE.a + (GRADE.b-GRADE.a)*Math.acos(2*y/GRADE.h-1)/Math.PI;   // where the track is at height y on the ramp
  const STEEL_END = gradeX(STREET+2.2), CUT0 = gradeX(STREET);                         // steel until ~2 m above the street; below the street is the cut
  const BG = THEME.bg;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);   // replaced by the sky dome below

  const camera = new THREE.PerspectiveCamera(42, vw()/vh(), 0.4, 600);
  // no orbiting in a scroll hero — the camera is driven by scroll; this stub keeps the framing code readable
  const controls = { target: new THREE.Vector3(), update(){ camera.lookAt(this.target); } };

  /* ---------- procedural studio environment (reflections on the steel, no HDRI) ---------- */
  function studioEnv(){
    const pmrem = new THREE.PMREMGenerator(renderer);
    const s = new THREE.Scene();
    s.background = new THREE.Color(0x3a3c40).multiply(new THREE.Color(...THEME.tint));
    // dome with a bright horizon BAND (studio sweep) → reads as a specular waterline on the steel,
    // darker above and below for metallic contrast.
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(60, 48, 32),
      new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors:true })
    );
    { const g=dome.geometry, pos=g.attributes.position, col=[];
      for(let i=0;i<pos.count;i++){
        const yy = pos.getY(i)/60;                         // -1..1
        const band = Math.exp(-Math.pow((yy-0.06)/0.12,2));// tight bright strip near the horizon
        const base = 0.09 + 0.14*(yy*0.5+0.5);             // deep dark field, a touch brighter up top
        const v = Math.min(1, base + 1.0*band);
        col.push(v*THEME.tint[0], v*THEME.tint[1], v*THEME.tint[2]);   // the world the steel reflects is gold
      }
      g.setAttribute('color', new THREE.Float32BufferAttribute(col,3)); }
    s.add(dome);
    // soft panels = studio softboxes → crisp streaks on the stainless
    const panel=(x,y,z,w,h,i)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:0xffffff})); m.position.set(x,y,z); m.lookAt(0,0,0); m.material.color.multiplyScalar(i); s.add(m); };
    panel(0, 34, 4, 46, 12, 2.2);     // key overhead strip
    panel(-28, 12, 16, 10, 26, 1.6);  // tall left softbox (vertical streak)
    panel(26, 10, -12, 10, 24, 1.1);  // right/back
    const tex = pmrem.fromScene(s, 0, 0.1, 120).texture;
    pmrem.dispose(); s.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
    return tex;
  }
  scene.environment = studioEnv();

  /* ---------- lights ---------- */
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(-14, 22, 10);
  key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096);
  key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02; key.shadow.radius = 3;
  { const d=36, c=key.shadow.camera; c.left=-d; c.right=d; c.top=d; c.bottom=-d; c.near=1; c.far=190; c.updateProjectionMatrix(); }
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.5);
  rim.position.set(18, 10, -14); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.06));
  const hemi = new THREE.HemisphereLight(0x8899aa, 0x111111, 0.2); scene.add(hemi);

  /* ---------- atmosphere: the real sun over 3 Av–149 St + live Bronx weather (Open-Meteo, no key) ----------
     preview overrides:  ?wx=clear|partly|overcast|fog|drizzle|rain|snow|storm   ?hour=0..24 (New York time) */
  const BRONX = { lat:40.8164, lon:-73.9175, tz:'America/New_York' };
  const QS = new URLSearchParams(location.search);
  function sunPos(date){                                   // degrees; az from north, clockwise
    const rad=Math.PI/180, d=date.getTime()/86400000+2440587.5-2451545.0;
    const g=(357.529+0.98560028*d)*rad, q=280.459+0.98564736*d;
    const L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad, e=(23.439-0.00000036*d)*rad;
    const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)), dec=Math.asin(Math.sin(e)*Math.sin(L));
    const gmst=((18.697374558+24.06570982441908*d)%24+24)%24, H=(gmst*15+BRONX.lon)*rad-ra, lat=BRONX.lat*rad;
    const el=Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(H));
    const az=Math.atan2(-Math.sin(H), Math.tan(dec)*Math.cos(lat)-Math.sin(lat)*Math.cos(H));
    return { el:el/rad, az:((az/rad)+360)%360 };
  }
  // "now" in the Bronx, or today at ?hour= New York time
  function bronxDate(){
    const now=new Date(); if (!QS.has('hour')) return now;
    const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:BRONX.tz,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(now).map(p=>[p.type,p.value]));
    const nyAsUTC=Date.UTC(+parts.year,+parts.month-1,+parts.day,+parts.hour,+parts.minute), off=nyAsUTC-now.getTime();
    const h=Math.max(0,Math.min(24,parseFloat(QS.get('hour'))||0));
    return new Date(Date.UTC(+parts.year,+parts.month-1,+parts.day,0,0)+h*3600000-off);
  }
  const WX_LABEL={ clear:'Clear', partly:'Partly cloudy', overcast:'Overcast', fog:'Fog', drizzle:'Drizzle', rain:'Rain', snow:'Snow', storm:'Thunderstorm' };
  const wxFromCode=c=> c<=1?'clear': c===2?'partly': c===3?'overcast': (c===45||c===48)?'fog': (c>=51&&c<=57)?'drizzle':
    ((c>=61&&c<=67)||(c>=80&&c<=82))?'rain': ((c>=71&&c<=77)||c===85||c===86)?'snow': c>=95?'storm':'clear';
  const WX = { kind: QS.get('wx') in WX_LABEL ? QS.get('wx') : 'clear', cloud:0, precip:0, windKmh:8, windDir:270, tempF:null, live:false };
  const CLOUD={ clear:0.05, partly:0.4, overcast:0.92, fog:0.85, drizzle:0.88, rain:0.95, snow:0.92, storm:1.0 };
  const DENS ={ drizzle:0.35, rain:0.8, storm:1.0, snow:0.75 };

  // sky dome: horizon→zenith gradient + sun glow + lightning; follows the camera
  const sky = new THREE.Mesh(new THREE.SphereGeometry(450,48,24), new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ zen:{value:new THREE.Color()}, hor:{value:new THREE.Color()}, gnd:{value:new THREE.Color()},
               sunDir:{value:new THREE.Vector3(0,1,0)}, sunCol:{value:new THREE.Color()}, sunAmt:{value:0}, flash:{value:0} },
    vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 zen,hor,gnd,sunCol,sunDir; uniform float sunAmt,flash; varying vec3 vDir;
      void main(){ vec3 d=normalize(vDir); float h=d.y;
        vec3 c = h>0.0 ? mix(hor,zen,pow(clamp(h,0.0,1.0),0.55)) : mix(hor,gnd,clamp(-h*6.0,0.0,1.0));
        float s=max(dot(d,normalize(sunDir)),0.0);
        c += sunCol*sunAmt*(pow(s,900.0)*6.0 + pow(s,24.0)*0.35 + pow(s,4.0)*0.12);
        c += vec3(0.75,0.8,1.0)*flash*(0.35+0.65*smoothstep(-0.1,0.5,h));
        gl_FragColor=vec4(c,1.0); }`
  }));
  sky.renderOrder=-1; scene.add(sky);
  scene.background=null;
  scene.fog = new THREE.FogExp2(0x000000, 0.0);

  // precipitation: GPU-animated rain streaks / snow flakes that wrap around the camera
  const PBOX=new THREE.Vector3(46,26,46);
  function precipGeo(n, verts){ const g=new THREE.BufferGeometry(), pos=new Float32Array(n*verts*3), seed=new Float32Array(n*verts*4), tip=new Float32Array(n*verts);
    for (let i=0;i<n;i++){ const r=[Math.random(),Math.random(),Math.random(),Math.random()];
      for (let v=0;v<verts;v++){ const k=i*verts+v; seed.set(r,k*4); tip[k]=v; } }
    g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('seed',new THREE.BufferAttribute(seed,4)); g.setAttribute('tip',new THREE.BufferAttribute(tip,1));
    g.boundingSphere=new THREE.Sphere(new THREE.Vector3(),1e6); return g; }
  const precipVS=`attribute vec4 seed; attribute float tip; uniform float time,len,sway,size; uniform vec3 camPos,box,vel; varying float vA;
    void main(){ vec3 p=seed.xyz*box + vel*time*(0.8+0.4*seed.w);
      p.x += sway*sin(time*0.9+seed.w*6.283); p.z += sway*cos(time*0.7+seed.w*4.0);
      vec3 o=camPos-box*0.5; p=mod(p-o,box)+o;

        const waterTower=(x,z,y)=>{ const g=new THREE.Group(); g.position.set(x,y,z);

          const tank=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.75,3.2,18),woodM); tank.position.y=4.2; g.add(tank);
          const cap=new THREE.Mesh(new THREE.ConeGeometry(1.85,1.3,18),roofM); cap.position.y=6.45; g.add(cap);
          g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } }); scene.add(g); };
        // two rows facing the line: +z side (platform side) and −z side, from far up the line to past the portal
        for (const side of [1,-1]){
          let x=-330; const zFront = side>0 ? 26 : -20;
          while (x < T.x0+150){
            const w=11+rr()*16, h=STORY*(5+Math.floor(rr()*4))+1.0, d=14+rr()*8, gap=rr()<0.3?2+rr()*5:0.15;
            const z0=side>0?zFront+rr()*2:zFront-d-rr()*2, z1=z0+d;
            const near=Math.abs(x+w/2-60)<160;                  // only buildings near the action cast shadows (perf)
            if (x+w>CUT0-20 && x<T.x0-10){ x+=w+gap; continue; }   // the ramp's own neighbours go here (below)
            building(x,x+w,z0,z1,h,mats[Math.floor(rr()*mats.length)],near);
            if (rr()<0.32) waterTower(x+w*(0.3+rr()*0.4), (z0+z1)/2+(rr()-0.5)*3, G+h+0.3);
            x+=w+gap;
          }
        }
        // flanking the ramp (from the 3D references): a big brick apartment complex on one side…
        building(CUT0-18, T.x0-8, -40, -9, STORY*10+1, mats[0], true);
        building(CUT0+10, CUT0+38, -52, -40, STORY*12+1, mats[4], true);
        // …and a low rooftop parking garage on the other, cars on the deck
        { const gcv=document.createElement('canvas'); gcv.width=256; gcv.height=256; const c=gcv.getContext('2d');
          c.fillStyle='#8b8a85'; c.fillRect(0,0,256,256); c.fillStyle='#1b1c1e'; for (let k=0;k<4;k++) c.fillRect(0,k*64+18,256,30);
          c.fillStyle='rgba(0,0,0,0.25)'; for (let x=0;x<256;x+=64) c.fillRect(x,0,6,256);
          const gt=new THREE.CanvasTexture(gcv); gt.wrapS=THREE.RepeatWrapping; gt.colorSpace=THREE.SRGBColorSpace;
          const gx0=CUT0-24, gx1=T.x0-12, gz0=8.5, gz1=44, gh=12.4, gm=new THREE.MeshStandardMaterial({ map:gt, roughness:0.9, envMapIntensity:0.45 });
          const gg=new THREE.BoxGeometry(gx1-gx0,gh,gz1-gz0), uv=gg.attributes.uv;
          for (let f=0;f<6;f++){ const fw=(f<2)?(gz1-gz0):(gx1-gx0); for (let k=0;k<4;k++){ const i=f*4+k; uv.setX(i, uv.getX(i)*fw/16); } }
          const gar=new THREE.Mesh(gg,[gm,gm,roofM,roofM,gm,gm]); gar.position.set((gx0+gx1)/2,G+gh/2,(gz0+gz1)/2); gar.castShadow=gar.receiveShadow=true; scene.add(gar);
          const carCols=[0x9a9da2,0x2a2c30,0xd9d9d6,0x6e1f22,0x1f3550,0x55585c];
          for (let i=0;i<34;i++){ const cx=gx0+3+rr()*(gx1-gx0-6), cz=gz0+3+rr()*(gz1-gz0-6);
            const car=new THREE.Mesh(new THREE.BoxGeometry(4.4,1.35,1.8), new THREE.MeshStandardMaterial({ color:carCols[Math.floor(rr()*carCols.length)], metalness:0.6, roughness:0.4 }));
            car.position.set(cx,G+gh+0.7,cz); car.rotation.y=(rr()<0.5?0:Math.PI/2)+(rr()-0.5)*0.1; car.castShadow=true; scene.add(car); } }
        // distant skyline to the south (seen over the portal on the way down): taller towers, no shadows
        for (let i=0;i<22;i++){ const x=T.x0+230+rr()*380, z=(rr()-0.5)*520, w=16+rr()*28, d=16+rr()*28, h=40+Math.pow(rr(),1.6)*190;
          building(x,x+w,z,z+d,h,mats[Math.floor(rr()*mats.length)],false); }
        // a few more street lamps along the at-grade stretch where the train waits
        for (const x of [-70,-40,-10]){ box(x-0.08,x+0.08, G, G+5.6, 7.4,7.56, plateM); box(x-0.08,x+0.08, G+5.5,G+5.62, 6.4,7.56, plateM,false);
          box(x-0.35,x+0.35, G+5.42,G+5.5, 6.3,6.75, poleLampM,false);
          const pl=new THREE.PointLight(0xf2efe8, 1.6, 22, 2); pl.position.set(x,G+5.2,6.5); scene.add(pl); poleRefs.push(pl); }
      }
      // tunnel shell: bed, roof, walls
      box(T.x0,T.x1, yb-0.4, yb, T.z0, T.z1, concrete, false);
      box(T.x0,T.x1, yt, yt+0.5, T.z0, T.z1, concrete);
      box(T.x0,T.x1, yb, yt, T.z0-0.5, T.z0, concrete);
      box(T.x0,T.x1, yb, yt, T.z1, T.z1+0.5, concrete);
      // running lights on both walls — they stream past as the train moves
      for (let x=T.x0+4; x<T.x1; x+=7){ box(x,x+1.4, 2.35,2.47, T.z0,T.z0+0.06, lampM,false); box(x,x+1.4, 2.35,2.47, T.z1-0.06,T.z1, lampM,false); }
      // station: platform at door-sill height on the +z side, glowing gold wall, ceiling light bars
      box(T.st0,T.st1, yb, -0.36, 1.62, T.z1, platM);
      box(T.st0,T.st1, -0.36,-0.34, 1.62,1.95, edgeM,false);                 // platform edge strip
      box(T.st0,T.st1, -0.34, yt, T.z1-0.08, T.z1, tileM,false);           // lit station wall
      for (let x=T.st0+2; x<T.st1-2; x+=5) box(x,x+3.2, yt-0.12,yt, 2.4,3.6, lampM,false);
    }

    // camera: 3/4 oncoming (same framing as the line-art study)
    const eyeY=(b.max.y+b.min.y)/2;
    camera.position.set(b.max.x+carLen*0.38, eyeY-carLen*0.03, b.max.z+carLen*0.26);
    controls.target.set(b.max.x-carLen*0.35, eyeY-carLen*0.06, 0);
    controls.update();
    homePos=camera.position.clone(); homeTgt=controls.target.clone();
    homePos.y+=GRADE.h; homeTgt.y+=GRADE.h;                      // rest shot is up beside the elevated deck

    // keep the key light's shadow following the action
    key.target.position.set(camera.position.x - carLen*0.8, eyeY, 0); scene.add(key.target);
    keyOff = key.position.clone().sub(key.target.position);

    // where the train waits before you scroll: lead cab ~2.2 car-lengths down the track
    pStart=(-carLen*2.2)-b.max.x;
    train.position.x=pStart;

    /* ---------- practical lights ---------- */
    const lead=train.children[0];
    // headlights: throw light down the track ahead of the cab
    for (const z of [-0.95,0.95]){
      const sp=new THREE.SpotLight(0xfff1dc, 5.0, 48, 0.34, 0.75, 1.4); sp.position.set(9.3,-0.3,z);
      sp.target.position.set(40,-1.9,z*0.4); lead.add(sp); lead.add(sp.target); }
    // the lead car's own interior light (spills out through the windows onto the tunnel walls)
    { const il=new THREE.PointLight(0xfff4e4, 0.55, 9, 2); il.position.set(0,1.45,0); lead.add(il); }
    // station lights over the platform
    for (const dx of [-7,7]){ const sl=new THREE.PointLight(0xf6f3ec, 1.5, 18, 2); sl.position.set(STOP_X+dx,2.9,3.3); scene.add(sl); }
    // tunnel lamps: two lights leapfrog the wall lamps nearest the camera (even / odd lamps), fading as
    // they hand over so nothing pops — light sweeps over the train as it passes each lamp
    for (let i=0;i<2;i++){ const tl=new THREE.PointLight(0xf4f1ea, 0, 9, 2); scene.add(tl); tunnelLights.push(tl); }
    // every surface that reflects the studio environment, so the tunnel can actually get dark
    scene.traverse(o=>{ const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];
      for (const m of ms) if (m && m.envMapIntensity!==undefined && !envMats.has(m)) envMats.set(m,m.envMapIntensity); });

    setGround(); applyAtmosphere();
    window.__ready=true;
  }, (err)=>{ window.__err=String(err); });

  addEventListener('resize', ()=>{ camera.aspect=vw()/vh(); camera.updateProjectionMatrix(); renderer.setSize(vw(),vh(),false); });

  /* ---------- scroll drives the scene ----------
     approach (static loop camera) → follow the lead car into the tunnel → fly in through its side window
     → the train brakes into the station while the camera turns to the doors → the doors open. */
  const sceneEl = document.getElementById('scene');
  const progress = ()=>{ const total=sceneEl.offsetHeight-innerHeight; return total<=0 ? 0 : Math.min(1,Math.max(0,-sceneEl.getBoundingClientRect().top/total)); };
  const smooth = (e0,e1,x)=>{ const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0))); return t*t*(3-2*t); };
  const SCRUB_TO=0.82;                                     // scroll zone, as the page overlay
  let s=0;                                                  // eased scroll position, 0..1
  // train speed vs scroll: pull away from rest, cruise, brake into the station (integrated into a position table)
  const BRAKE0=0.66, BRAKE1=0.84;
  const vel = t => t<0.08 ? t/0.08 : t<BRAKE0 ? 1 : t<BRAKE1 ? 1-(t-BRAKE0)/(BRAKE1-BRAKE0) : 0;
  const CUM=[0]; for (let i=1;i<=400;i++) CUM.push(CUM[i-1]+vel((i-0.5)/400)/400);
  const trainX = t => { const f=Math.min(1,Math.max(0,t))*400, i=Math.floor(f), c=i>=400?CUM[400]:CUM[i]+(CUM[i+1]-CUM[i])*(f-i);
    return pStart + (STOP_X-pStart)*c/CUM[400]; };
  function setDoors(f){ for (const car of train.children) for (const leaf of (car.userData.leaves||[])) leaf.position.x=leaf.userData.dir*0.79*f; }
  const V=(x,y,z)=>new THREE.Vector3(x,y,z), lerpV=(a,b,t)=>a.clone().lerp(b,t);
  const bez=(p0,p1,p2,t)=>p0.clone().multiplyScalar((1-t)*(1-t)).add(p1.clone().multiplyScalar(2*(1-t)*t)).add(p2.clone().multiplyScalar(t*t));
  // camera beats, in the lead car's frame (x relative to car 1's centre) where they ride with the train
  const CHASE_P=V(6,1.1,3.3),  CHASE_T=V(40,0.8,0.5);       // alongside the cab, looking down the tunnel
  const WIN=V(2.92,1.17,1.55);                              // the big side window we fly through
  const SEAT_P=V(-0.4,0.85,-0.9), AISLE_T=V(8,0.8,-0.5);
  const FACE_P=V(0,0.72,-0.9), DOOR_T=V(0,0.72,1.5);         // square-on: on the doors' centre line, at door-centre height
  const FLY_C=WIN.clone().multiplyScalar(2).sub(CHASE_P.clone().add(SEAT_P).multiplyScalar(0.5));  // bezier passes through WIN
  const pos=new THREE.Vector3(), tgt=new THREE.Vector3();
  function choreo(t){
    const X=trainX(t); train.position.x=X;
    for (const car of train.children){ const cx=X+car.position.x, ya=gradeY(cx-6.5), yf=gradeY(cx+6.5);
      car.position.y=(ya+yf)/2; car.rotation.z=Math.atan2(yf-ya,13); }
    const PY=train.children[0].position.y, rel=v=>v.clone().add(V(X,PY,0));
    // narrow (portrait) screens: aim toward the waiting train and widen the lens a little
    const k=Math.min(1,Math.max(0,(1.25-camera.aspect)/0.65)), hT=homeTgt.clone().lerp(V(homeTgt.x-40,homeTgt.y-0.6,-1), 0.55*k);
    if (Math.abs(camera.fov-(42+12*k))>0.01){ camera.fov=42+12*k; camera.updateProjectionMatrix(); }
    if (t<0.50){                                            // approach, then arc up and follow the cab down the ramp into the portal
      const c=smooth(0.20,0.50,t), ch=rel(CHASE_P);
      const ctrl=homePos.clone().add(ch).multiplyScalar(0.5).add(V(0,30.0,1.0));   // drone rise (~23 m) over the ramp, then a dive into the cut; clears the steel, walls and garage (checked offline)
      pos.copy(bez(homePos,ctrl,ch,c));
      // aim: lock onto the lead cab early (so from up high we follow the front down the ramp), then look down the tunnel
      tgt.copy(lerpV(lerpV(hT, rel(V(14,0.2,0)), smooth(0.20,0.29,t)), rel(CHASE_T), smooth(0.42,0.50,t)));
    } else if (t<0.64){                                     // fly in through the side window
      const f=smooth(0.50,0.64,t);
      pos.copy(rel(bez(CHASE_P,FLY_C,SEAT_P,f))); tgt.copy(rel(lerpV(CHASE_T,AISLE_T,f)));
    } else {                                                // ride in, turning to the doors as the train stops
      const c=smooth(0.64,0.84,t);
      pos.copy(rel(lerpV(SEAT_P,FACE_P,c))); tgt.copy(rel(lerpV(AISLE_T,DOOR_T,c)));
    }
    camera.position.copy(pos); camera.lookAt(tgt);
    setDoors(smooth(0.86,0.98,t));
    // inside the tunnel the steel stops seeing the bright studio — only the lamps light it
    const inT=smooth(TUNNEL.x0-4, TUNNEL.x0+14, pos.x);
    for (const [m,base] of envMats) m.envMapIntensity=base*THREE.MathUtils.lerp(ATM.env,0.3,inT);
    const out=1-inT;
    hemi.intensity=ATM.hemi*(0.15+0.85*out); scene.fog.density=ATM.fog*out;
    if (floorRef){ floorRef.material.uniforms.fogDen.value=scene.fog.density; floorRef.material.uniforms.fogCol.value.copy(scene.fog.color); }
    keyOff.copy(ATM.keyDir).multiplyScalar(90); key.intensity=ATM.key;
    const poles=ATM.poleOn?1:0; for (const pl of poleRefs) pl.intensity=1.6*poles; if (poleLampM) poleLampM.emissiveIntensity=2.4*poles;
    for (const pm of [rain,snow]){ const u=pm.material.uniforms; u.camPos.value.copy(pos); u.opacity.value=ATM.precipOpacity*out; }
    { const L0=TUNNEL.x0+4.7, SPC=7;
      tunnelLights.forEach((tl,i)=>{ const k=Math.round((pos.x-L0-i*SPC)/(2*SPC))*2+i, lx=L0+k*SPC;
        tl.position.set(lx,2.3,0.8); tl.intensity=inT*2.2*Math.max(0,1-Math.abs(pos.x-lx)/(2*SPC)); }); }
    // depth of field: hold focus on the cab outside, rack to the doors inside the car
    if (bokeh){ const cab=V(X+9,0.4+PY,0), inside=smooth(0.50,0.64,t);
      const fd=THREE.MathUtils.lerp(pos.distanceTo(cab), pos.distanceTo(rel(DOOR_T)), inside);
      bokeh.uniforms.focus.value=fd; bokeh.uniforms.aperture.value=THREE.MathUtils.lerp(0.00035,0.0022,inside); }
    { const fwd=tgt.clone().sub(pos).setY(0); if (fwd.lengthSq()>1e-6) fwd.normalize();    // shadow box centred ~26 m into the shot
      key.target.position.set(pos.x+fwd.x*26, PY-1, pos.z*0.3+fwd.z*26); key.position.copy(key.target.position).add(keyOff); }
  }
  /* ---------- post: AO → bloom → depth of field → tone map → film finish ---------- */
  const lowPower = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth,innerHeight) < 600;
  renderer.setPixelRatio(Math.min(devicePixelRatio, lowPower ? 1.5 : 2));
  const rt = new THREE.WebGLRenderTarget(1,1,{ type:THREE.HalfFloatType, samples: lowPower?0:4 });
  const composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(vw(), vh());
  composer.addPass(new RenderPass(scene, camera));
  if (!lowPower){
    const gtao = new GTAOPass(scene, camera, vw(), vh());
    gtao.updateGtaoMaterial({ radius:0.55, distanceExponent:1.4, thickness:1.2, scale:1.15, samples:16 });
    gtao.updatePdMaterial({ lumaPhi:10, depthPhi:2, normalPhi:3, radius:6, rings:2, samples:16 });
    gtao.blendIntensity = 0.9; composer.addPass(gtao);
    // AO must ignore the headlight glow cards (flat transparent sprites) or it darkens the panel behind them
    gtao.overrideVisibility = function(){ const cache=this._visibilityCache;
      this.scene.traverse(o=>{ cache.set(o,o.visible); if (o.isPoints||o.isLine||o.isSprite) o.visible=false; }); };
  }
  const bloom = new UnrealBloomPass(new THREE.Vector2(vw(),vh()), 0.45, 0.35, 1.9)   // threshold above any reflection: only real lights bloom; composer.addPass(bloom);
  const bokeh = lowPower ? null : new BokehPass(scene, camera, { focus:20, aperture:0.00035, maxblur:0.006 });
  if (bokeh) composer.addPass(bokeh);
  composer.addPass(new OutputPass());
  const finish = new ShaderPass({
    uniforms:{ tDiffuse:{value:null}, time:{value:0}, res:{value:new THREE.Vector2(vw(),vh())} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform sampler2D tDiffuse; uniform float time; uniform vec2 res; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      void main(){
        vec2 c=vUv-0.5; float r2=dot(c,c);
        vec2 off=c*r2*0.010;                                          // faint lens fringing toward the edges
        vec3 col=vec3(texture2D(tDiffuse,vUv+off).r, texture2D(tDiffuse,vUv).g, texture2D(tDiffuse,vUv-off).b);
        col=mix(col, col*col*(3.0-2.0*col), 0.22);                    // gentle S-curve
        float l=dot(col,vec3(0.2126,0.7152,0.0722));
        col+=vec3(-0.006,0.0,0.010)*(1.0-l)*(1.0-l);                   // a breath of cool in the shadows
        col*=mix(1.0, smoothstep(0.95,0.25,sqrt(r2)*1.2), 0.5);        // vignette
        col+=(hash(floor(vUv*res)+fract(time*7.0)*vec2(97.0,57.0))-0.5)*0.03*(1.0-0.5*l);   // grain
        gl_FragColor=vec4(col,1.0);
      }`
  });
  composer.addPass(finish);
  addEventListener('resize', ()=>{ composer.setSize(vw(),vh()); finish.uniforms.res.value.set(vw(),vh()); });

  const clock = new THREE.Clock();
  function tick(){
    FRAME.n++; window.__frames=FRAME.n;
    const dt=Math.min(clock.getDelta(),0.1);
    if (train){
      if (reduce) choreo(0);                                    // reduced motion: the opening still, nothing moves
      else { s += (smooth(0,SCRUB_TO,progress())-s)*Math.min(1,dt*9); choreo(s); }   // ease toward the scroll position
    }
    finish.uniforms.time.value = clock.elapsedTime;
    rain.material.uniforms.time.value = snow.material.uniforms.time.value = clock.elapsedTime;
    sky.position.copy(camera.position);
    // lightning in thunderstorms: a double flicker every 6–14 s
    if (WX.kind==='storm' && !reduce){ if (ATM.flashT<0 && Math.random()<dt/9) ATM.flashT=0;
      if (ATM.flashT>=0){ ATM.flashT+=dt; const f=ATM.flashT, a=(f<0.08?1:f<0.16?0.2:f<0.26?0.8:Math.max(0,1-(f-0.26)*4));
        sky.material.uniforms.flash.value=a; hemi.intensity+=a*2.2; if (f>0.6){ ATM.flashT=-1; sky.material.uniforms.flash.value=0; } } }
    composer.render();
    requestAnimationFrame(tick);
  }
  tick();
})();
  </script>
</body>
