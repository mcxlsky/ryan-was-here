<html lang="en" data-theme="dark">
<head>

  <style>
    :root {
      --bg: #171715;
      --ink: #f2f2f0;
      --muted: rgba(242,242,240,0.6);
      --font: -apple-system, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
      --frame: 8px;
      --frame-r: 12px;
      --foot-h: 44px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font);
           -webkit-font-smoothing: antialiased; padding: var(--frame); display: flex; flex-direction: column; }

    /* white frame */
    body::after { content: ''; position: fixed; inset: var(--frame) var(--frame) calc(var(--frame) + var(--foot-h)) var(--frame);
                  z-index: 1000; pointer-events: none; border-radius: var(--frame-r);
                  box-shadow: 0 0 0 100px #fff; }

    /* ---------- header tab ---------- */
    .tab { --tab-h: 52px; --tab-r: 14px; position: fixed; z-index: 1001; top: var(--frame); left: 50%; transform: translateX(-50%);
           max-width: calc(100% - 2 * var(--frame) - 36px);
           height: var(--tab-h); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px;
           background: #fff; color: #111; border-radius: 0 0 var(--tab-r) var(--tab-r); font-family: var(--font); }
    .tab::before, .tab::after { content: ''; position: absolute; top: -1px; width: calc(var(--tab-r) + 1px); height: calc(var(--tab-r) + 1px); pointer-events: none; }
    .tab::before { right: calc(100% - 1px); background: radial-gradient(circle at 0 100%, transparent calc(var(--tab-r) - 0.5px), #fff var(--tab-r)); }
    .tab::after  { left: calc(100% - 1px);  background: radial-gradient(circle at 100% 100%, transparent calc(var(--tab-r) - 0.5px), #fff var(--tab-r)); }
    .tab a { color: inherit; text-decoration: none; }
    .tab-brand { display: flex; align-items: center; gap: 10px; height: 100%; flex: none; }
    .tab-r { width: 32px; height: 32px; border-radius: 50%; background: #e5ab00; color: #111; display: grid; place-items: center;
             font: 700 20px/1 var(--font); letter-spacing: -0.03em; padding-top: 1px; }
    .tab-name { font: 600 15px/1 var(--font); letter-spacing: -0.01em; white-space: nowrap; }
    .tab-links { display: flex; align-items: center; gap: 2px; margin-left: 16px; }
    .tab-links a, .tab-drop a { font: 500 14.5px/1 var(--font); color: rgba(17,17,17,0.52); padding: 9px 10px; border-radius: 8px;
             transition: color .15s, background .15s; white-space: nowrap; }
    .tab-links a:hover, .tab-drop a:hover { color: #111; background: rgba(17,17,17,0.05); }
    .tab-links a[aria-current="page"], .tab-drop a[aria-current="page"] { color: #111; }
    .tab-cta { margin-left: 14px; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 9px;
               background: #111; color: #fff !important; font: 600 14px/1 var(--font); white-space: nowrap; transition: background .15s; }
    .tab-cta:hover { background: #2a2a2a; }
    .tab-cta svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
    .tab-menu { display: none; -webkit-appearance: none; appearance: none; width: 36px; height: 36px; border: 0; border-radius: 9px;
                background: rgba(17,17,17,0.06); cursor: pointer; place-items: center; }
    .tab-menu i, .tab-menu i::before, .tab-menu i::after { display: block; width: 16px; height: 1.6px; background: #111; border-radius: 1px; position: relative; transition: transform .25s, top .25s, background .2s; }
    .tab-menu i::before, .tab-menu i::after { content: ''; position: absolute; left: 0; } .tab-menu i::before { top: -5px; } .tab-menu i::after { top: 5px; }
    .tab.open .tab-menu i { background: transparent; } .tab.open .tab-menu i::before { top: 0; transform: rotate(45deg); } .tab.open .tab-menu i::after { top: 0; transform: rotate(-45deg); }
    .tab-drop { position: absolute; top: calc(100% + 8px); right: 0; min-width: 190px; padding: 6px; background: #fff; border-radius: 14px; display: grid;
                box-shadow: 0 12px 32px -8px rgba(0,0,0,0.35); opacity: 0; visibility: hidden; transform: translateY(-6px);
                transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1), visibility 0s linear .25s; }
    .tab-drop a { padding: 12px 12px; font-size: 15px; }
    .tab.open .tab-drop { opacity: 1; visibility: visible; transform: none; transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1), visibility 0s; }
    @media (max-width: 760px){ .tab { --tab-h: 50px; --tab-r: 12px; } .tab-links { display: none; } .tab-menu { display: grid; } .tab-cta { margin-left: 12px; } }
    @media (max-width: 380px){ .tab-name { display: none; } }

    /* ---------- orbital carousel ---------- */
    .stage { flex: 1; position: relative; display: flex; flex-direction: column;
             align-items: center; justify-content: center; overflow: hidden; }

    .orbit-wrap { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }

    .orbit-scene { width: 100%; height: clamp(240px, 38vh, 420px); position: relative; }

    .orbit { position: absolute; width: 100%; height: 100%; }

    .orbit-item { position: absolute; left: 50%; top: 50%;
                  cursor: pointer;
                  transition: transform 0.7s cubic-bezier(.4, 0, .15, 1),
                              opacity 0.5s ease; }

    .orbit-item img { width: 100%; height: 100%; object-fit: contain;
                      filter: drop-shadow(0 8px 40px rgba(0,0,0,0.6));
                      pointer-events: none; }

    .orbit-item.active img { filter: drop-shadow(0 12px 48px rgba(0,0,0,0.5)) brightness(1.1); }

    .orbit-item .item-glow { position: absolute; inset: -20%; border-radius: 50%;
                             background: radial-gradient(circle, rgba(229,171,0,0.08) 0%, transparent 70%);
                             opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
    .orbit-item.active .item-glow { opacity: 1; }

    /* info panel */
    .info { text-align: center; margin-top: clamp(16px, 3vh, 32px); min-height: 100px; }

    .info-inner { transition: opacity 0.35s ease, transform 0.45s cubic-bezier(.2,.8,.2,1); }
    .info-inner.out { opacity: 0; transform: translateY(8px); }
    .info-inner.in { opacity: 1; transform: none; }

    .info-logo { height: 28px; width: auto; margin-bottom: 10px; }
    .info-logo--hush { height: 22px; }
    .info-logo--heatcheck { height: 30px; }
    .info-logo--khealth { height: 28px; }
    .info-logo--fleeting { height: 24px; }
    .info-desc { font: 400 clamp(14px, 1.6vw, 17px)/1.5 var(--font); color: var(--muted); margin-top: 4px; }
    .info-tags { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .info-tag { font: 500 11px/1 var(--font); letter-spacing: 0.04em; text-transform: uppercase;
                padding: 5px 9px; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.65); border-radius: 4px; }

    /* arrows */
    .arrow { position: fixed; top: 50%; z-index: 10; width: 56px; height: 56px; margin-top: -28px; display: grid; place-items: center;
             border: 0; cursor: pointer; background: rgba(255,255,255,0.06); border-radius: 50%;
             transition: background .2s, transform .2s; }
    .arrow:hover { background: rgba(255,255,255,0.14); }
    .arrow:active { transform: scale(0.92); }
    .arrow svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .arrow.prev { left: calc(var(--frame) + 18px); }
    .arrow.next { right: calc(var(--frame) + 18px); }
    .arrow:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* pager dots */
    .pager { position: fixed; bottom: calc(var(--foot-h) + var(--frame) + 20px); left: 50%; transform: translateX(-50%);
             z-index: 10; display: flex; gap: 10px; }
    .dot { -webkit-appearance: none; appearance: none; border: 0; padding: 8px 0; cursor: pointer; background: none; }
    .dot i { display: block; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25);
             transition: background .3s, transform .3s cubic-bezier(.2,.8,.2,1); }
    .dot[aria-current="true"] i { background: #fff; transform: scale(1.3); }

    /* ---------- footer ---------- */
    .foot { flex: none; position: relative; z-index: 1001; padding: 0 40px; }
    .foot-base { display: flex; justify-content: center; align-items: center; gap: 16px; height: var(--foot-h);
                 font: 400 12px/1.4 var(--font); color: rgba(17,17,17,0.6); }
    .foot-social { position: fixed; z-index: 6; right: calc(var(--frame) + 18px); bottom: calc(var(--frame) + var(--foot-h) + 18px);
                   display: flex; flex-direction: column; gap: 14px; }
    .foot-social svg { width: 18px; height: 18px; fill: #fff; opacity: 0.7; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35)); transition: opacity .2s; }
    .foot-social a:hover svg { opacity: 1; }

    @media (max-width: 720px){
      .orbit-scene { max-width: 400px; }
      .arrow { width: 44px; height: 44px; margin-top: -22px; }
      .arrow.prev { left: calc(var(--frame) + 8px); } .arrow.next { right: calc(var(--frame) + 8px); }
      .arrow svg { width: 20px; height: 20px; }
      .foot { padding: 0 22px; }
      .foot-social { right: calc(var(--frame) + 12px); bottom: calc(var(--frame) + var(--foot-h) + 12px); }
    }
    @media (prefers-reduced-motion: reduce){
      .orbit, .info-inner, .orbit-item, .orbit-item img { transition: none; }
    }
  </style>
</head>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    var PROJECTS = [
      { id: 'the-hush',  name: 'The Hush',  logo: 'logos/hush-white.svg',      logoClass: 'hush',
        desc: 'SaaS platform for finding local happy hours',
        tags: ['Product design', 'Founder'], glb: '../preview images/martini-glass.glb', fallback: '../preview images/martini-glass.png' },
      { id: 'heatcheck', name: 'Heatcheck', logo: 'logos/heatcheck-white.svg',  logoClass: 'heatcheck',
        desc: 'Web player for discovering new music videos',
        tags: ['Brand', 'Founder'], glb: '../preview images/retro-radio.glb', fallback: '../preview images/heatcheck.png' },
      { id: 'k-health',  name: 'K Health',  logo: 'logos/khealth-white.svg',    logoClass: 'khealth',
        desc: 'AI-powered primary care serving 2M+ patients',
        tags: ['Senior Designer', '2022–2025'], glb: '../preview images/stethoscope.glb', fallback: '../preview images/khealth.png' },
      { id: 'fleeting',  name: 'Fleeting',  logo: 'logos/fleeting-white.svg',   logoClass: 'fleeting',
        desc: 'Freight logistics MVP for truck owners and drivers',
        tags: ['Solo Designer', '2019–2022'], glb: '../preview images/cascadia-truck.glb', fallback: '../preview images/fleeting.png' },
    ];

    var orbitEl = document.getElementById('orbit');
    var infoEl = document.getElementById('info');
    var pager = document.getElementById('pager');
    var N = PROJECTS.length;
    var cur = 0;
    var SLICE = 360 / N;
    var itemEls = [];
    var dots = [];

    var BASE_SIZE = 220;
    var FRONT_SCALE = 1;
    var SIDE_SCALE = 0.52;
    var BACK_SCALE = 0.36;

    PROJECTS.forEach(function(p, k) {
      var el = document.createElement('div');
      el.className = 'orbit-item' + (k === 0 ? ' active' : '');
      el.setAttribute('data-index', k);
      if (p.glb) el.setAttribute('data-glb', p.glb);

      el.innerHTML =
        '<div class="item-glow"></div>' +
        '<img src="' + (p.fallback || '') + '" alt="' + p.name + '" />';

      el.addEventListener('click', function() { go(k); });
      orbitEl.appendChild(el);
      itemEls.push(el);

      var d = document.createElement('button');
      d.className = 'dot'; d.type = 'button';
      d.setAttribute('aria-label', p.name);
      d.innerHTML = '<i></i>';
      if (k === 0) d.setAttribute('aria-current', 'true');
      d.addEventListener('click', function() { go(k); });
      pager.appendChild(d);
      dots.push(d);
    });

    function renderInfo(p) {
      return '<img class="info-logo info-logo--' + p.logoClass + '" src="' + p.logo + '" alt="' + p.name + '" />' +
        '<p class="info-desc">' + p.desc + '</p>' +
        '<div class="info-tags">' + p.tags.map(function(t) { return '<span class="info-tag">' + t + '</span>'; }).join('') + '</div>';
    }

    function go(n) {
      n = ((n % N) + N) % N;
      if (n === cur) return;
      cur = n;
      paint();
    }

    function getRadius() {
      var w = orbitEl.clientWidth || 600;
      var isMobile = window.innerWidth < 720;
      return isMobile ? Math.min(w * 0.42, 200) : Math.min(w * 0.38, 280);
    }

    function paint() {
      var R = getRadius();
      var isMobile = window.innerWidth < 720;
      var sz = isMobile ? 160 : BASE_SIZE;

      itemEls.forEach(function(el, k) {
        var angleDeg = ((k - cur) * SLICE % 360 + 360) % 360;
        var angleRad = angleDeg * Math.PI / 180;
        var isActive = k === cur;

        var x = Math.sin(angleRad) * R;
        var depth = Math.cos(angleRad);
        var y = -depth * 20;
        var sideS = isMobile ? 0.38 : SIDE_SCALE;
        var backS = isMobile ? 0.28 : BACK_SCALE;
        var scale = isActive ? FRONT_SCALE : (depth > 0 ? sideS + depth * 0.12 : backS);
        var itemW = sz * scale;
        var itemH = sz * scale;

        el.classList.toggle('active', isActive);
        el.style.width = itemW + 'px';
        el.style.height = itemH + 'px';

        if (isActive) {
          el.style.opacity = '1';
          el.style.zIndex = '10';
        } else if (depth < -0.2) {
          el.style.opacity = '0.15';
          el.style.zIndex = '1';
        } else {
          el.style.opacity = String(Math.max(0.3, 0.35 + depth * 0.35));
          el.style.zIndex = String(Math.round(depth * 5 + 5));
        }

        el.style.transform = 'translate(calc(-50% + ' + x + 'px), calc(-50% + ' + y + 'px))';
      });

      dots.forEach(function(d, k) { d.setAttribute('aria-current', k === cur ? 'true' : 'false'); });

      infoEl.classList.remove('in');
      infoEl.classList.add('out');

      setTimeout(function() {
        infoEl.innerHTML = renderInfo(PROJECTS[cur]);
        infoEl.classList.remove('out');
        infoEl.classList.add('in');
      }, 200);

      document.title = PROJECTS[cur].name + ' — Work — ryan was here';
      try { history.replaceState(null, '', '#' + PROJECTS[cur].id); } catch(e) {}
    }

    infoEl.innerHTML = renderInfo(PROJECTS[0]);
    window.addEventListener('resize', function() { paint(); });

    document.getElementById('prev').addEventListener('click', function() { go(cur - 1); });
    document.getElementById('next').addEventListener('click', function() { go(cur + 1); });
    addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
    });

    var x0 = null;
    orbitEl.addEventListener('touchstart', function(e) { x0 = e.touches[0].clientX; }, { passive: true });
    orbitEl.addEventListener('touchend', function(e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) go(dx < 0 ? cur + 1 : cur - 1);
    }, { passive: true });

    var pick = function() { var h = location.hash.slice(1), n = -1; PROJECTS.forEach(function(p, k) { if (p.id === h) n = k; }); return n; };
    var n0 = pick(); if (n0 >= 0) cur = n0;
    paint();
    addEventListener('hashchange', function() { var n = pick(); if (n >= 0 && n !== cur) go(n); });

    /* header menu */
    (function() {
      var t = document.getElementById('rnav'), b = document.getElementById('rnavToggle');
      function set(o) { t.classList.toggle('open', o); b.setAttribute('aria-expanded', o); }
      b.addEventListener('click', function() { set(!t.classList.contains('open')); });
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && t.classList.contains('open')) { set(false); b.focus(); } });
      document.addEventListener('pointerdown', function(e) { if (t.classList.contains('open') && !t.contains(e.target)) set(false); });
    })();
  </script>

  <!-- GLB 3D viewers: replace fallback images when models load -->
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const glbItems = document.querySelectorAll('.orbit-item[data-glb]');
  if (!glbItems.length) { /* nothing to do */ }

  const loader = new GLTFLoader();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  glbItems.forEach(item => {
    const src = item.dataset.glb;

    const size = item.getBoundingClientRect();
    const w = Math.round(size.width) || 240;
    const h = Math.round(size.height) || 240;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;

    const canvas = renderer.domElement;
    Object.assign(canvas.style, { width: '100%', height: '100%', objectFit: 'contain' });

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 100);
    camera.position.set(0, 0.25, 3);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dir = new THREE.DirectionalLight(0xffffff, 1.8);
    dir.position.set(2, 3, 4);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0xffffff, 0.6);
    rim.position.set(-3, 1, -2);
    scene.add(rim);

    let model = null;
    let hovered = false;
    let rotY = 0;

    loader.load(src, gltf => {
      model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const sz = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(sz.x, sz.y, sz.z);
      const scale = 1.5 / maxDim;
      model.scale.setScalar(scale);
      model.position.sub(center.multiplyScalar(scale));
      scene.add(model);

      const img = item.querySelector('img');
      if (img) img.style.display = 'none';
      const glow = item.querySelector('.item-glow');
      if (glow) glow.style.display = 'none';
      item.appendChild(canvas);
      loop();
    });

    function loop() {
      if (!model) return;
      const speed = hovered ? 0.018 : 0.005;
      rotY += speed;
      model.rotation.y = rotY;
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    item.addEventListener('mouseenter', () => { hovered = true; });
    item.addEventListener('mouseleave', () => { hovered = false; });
  });
  </script>
</body>
