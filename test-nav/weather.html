<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bronx Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #e5ab00; --ink: #f2f2f0; --bg: #0f0f10; --card: #18181a; --line: rgba(255,255,255,0.08);
            --font: -apple-system, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* the gold R tile, same as the home page: back to the street */
    .rhome { position: fixed; top: 0; left: 0; z-index: 10; width: 74px; height: 74px; display: grid; place-items: center;
             background: var(--gold); color: #111; font: 700 46px/1 var(--font); letter-spacing: -0.03em; padding-top: 2px; }

    main { max-width: 1180px; margin: 0 auto; padding: clamp(88px, 12vh, 150px) 40px 20px; }
    .k { font: 500 12px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.5; margin-bottom: 18px; }
    h1 { font: 500 clamp(34px, min(7vw, 7vh), 96px)/1 var(--font); letter-spacing: -0.04em; margin-bottom: 10px; }
    .sub { font: 400 16px/1.5 var(--font); opacity: 0.6; }
    .now { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin-top: clamp(18px, 4vh, 56px); }
    .panel { background: #18181a; border: 1px solid var(--line); padding: 26px 28px; }
    .panel.gold { background: var(--gold); color: #111; border-color: var(--gold); }
    .lbl { font: 600 11px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; margin-bottom: 18px; }
    .clock { font: 500 clamp(40px, min(9vw, 9vh), 120px)/0.95 var(--font); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
    .clock small { font-size: 0.24em; letter-spacing: 0; margin-left: 8px; font-weight: 600; }
    .date { font: 500 15px/1.4 var(--font); margin-top: 14px; opacity: 0.75; }
    .temp { display: flex; align-items: center; gap: 18px; }
    .temp b { font: 500 clamp(40px, min(9vw, 9vh), 120px)/0.95 var(--font); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
    .temp svg { width: 64px; height: 64px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .cond { font: 500 17px/1.4 var(--font); margin-top: 14px; }
    .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 18px; }
    .fact { background: var(--bg); padding: 18px 20px; }
    .fact span { display: block; font: 500 11px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.5; margin-bottom: 10px; }
    .fact b { font: 500 22px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .hours { display: grid; grid-template-columns: repeat(12, minmax(56px, 1fr)); gap: 8px; margin-top: 18px; overflow-x: auto; }
    .hr { border: 1px solid var(--line); padding: 14px 8px; text-align: center; display: grid; gap: 10px; justify-items: center; }
    .hr span { font: 500 12px/1 var(--font); opacity: 0.55; }
    .hr svg { width: 22px; height: 22px; fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .hr b { font: 500 16px/1 var(--font); font-variant-numeric: tabular-nums; }
    .note { font: 400 13px/1.5 var(--font); opacity: 0.45; margin-top: 22px; }
    .off .need { opacity: 0.35; }
    @media (max-width: 720px){
      main { padding: 86px 22px 14px; }
      .now { grid-template-columns: 1fr 1fr; margin-top: 14px; gap: 10px; }
      .panel { padding: 14px; } .fact { padding: 10px 14px; } .note { display: none; } .temp { gap: 8px; } .temp svg { width: 34px; height: 34px; } .lbl { margin-bottom: 10px; }
      .facts { grid-template-columns: 1fr 1fr; }
      .hours { grid-template-columns: repeat(12, 60px); }
    }
    /* ---------- Footer (shared with the other pages) ---------- */
    .foot { position: relative; background: #0f0f10; border-top: 1px solid rgba(255,255,255,0.08); color: #f2f2f0; padding: 64px 40px 26px; }
    .foot-grid { display: grid; grid-template-columns: 2.6fr repeat(2, 1fr); gap: 32px; max-width: 1180px; margin: 0 auto; }
    .foot-name { font: 600 17px/1.3 var(--font); letter-spacing: -0.01em; }
    .foot-role { font: 400 14px/1.4 var(--font); opacity: 0.62; margin-top: 4px; }
    .foot h4 { font: 500 11px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.45; margin-bottom: 18px; }
    .foot ul { list-style: none; display: grid; gap: 14px; }
    .foot a, .foot button { color: #f2f2f0; text-decoration: none; font: 400 14px/1.2 var(--font); opacity: 0.78; background: none; border: 0; padding: 0; cursor: pointer; transition: opacity .2s; }
    .foot a:hover, .foot button:hover { opacity: 1; }
    .foot a:focus-visible, .foot button:focus-visible { outline: 1px solid rgba(255,255,255,0.7); outline-offset: 3px; }
    .foot-base { display: flex; justify-content: space-between; gap: 16px; max-width: 1180px; margin: 72px auto 0; padding-top: 18px;
                 border-top: 1px solid rgba(255,255,255,0.08); font: 400 12px/1.4 var(--font); opacity: 0.45; }
    .foot-base { align-items: center; }
    .foot-social { display: flex; gap: 18px; }
    .foot-base .foot-social a { display: grid; place-items: center; opacity: 1; }
    .foot-social svg { width: 18px; height: 18px; fill: #f2f2f0; opacity: 0.7; transition: opacity .2s; }
    .foot-social a:hover svg { opacity: 1; }
    @media (max-width: 720px){
      .foot { padding: 48px 22px 24px; }
      .foot-grid { grid-template-columns: 1fr 1fr; gap: 36px 24px; }
      .foot-id { grid-column: 1 / -1; }
      .foot-base { flex-direction: column-reverse; align-items: flex-start; gap: 18px; margin-top: 48px; }
    }

    /* one screen: the page never scrolls past the viewport; if the content can't fit (small phones) only the
       middle scrolls, with no visible bar, and the footer stays put */
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    main { flex: 1 1 auto; min-height: 0; width: 100%; overflow-y: auto; scrollbar-width: none; }
    main::-webkit-scrollbar { display: none; }
    /* the footer is the home page's line: copyright + social under a hairline that runs the full width */
    .foot { flex: none; background: none; border-top: 0; padding: 0 40px; }
    .foot .foot-base { max-width: none; margin: 0 -40px; padding: 24px 40px 26px; flex-direction: row; align-items: center; gap: 16px;
                       font: 400 12px/1.4 var(--font); color: rgba(242,242,240,0.6); }
    @media (max-width: 720px){
      .foot { padding: 0 22px; }
      .foot .foot-base { margin: 0 -22px; padding: 18px 22px 20px; }
      .foot-social { gap: 14px; }
    }
    .panel { padding: clamp(16px, 2.6vh, 26px) clamp(18px, 2.4vw, 28px); }
    .lbl { margin-bottom: clamp(10px, 1.8vh, 18px); }
    .facts, .hours { margin-top: clamp(10px, 1.8vh, 18px); }
    .fact { padding: clamp(10px, 1.8vh, 18px) 20px; }
    .hr { padding: clamp(8px, 1.4vh, 14px) 8px; gap: clamp(6px, 1vh, 10px); }
    .note { margin-top: 12px; }
    /* the frame: an 8px white border round the whole site, drawn over everything; edge-anchored tiles sit just inside it */
    :root { --frame: 8px; --frame-r: 12px; }
    /* drawn as a rounded window with a white spread round it, so the inside corners are rounded (and round off any tile sitting in a corner) */
    body::after { content: ''; position: fixed; inset: var(--frame); z-index: 1000; pointer-events: none; border-radius: var(--frame-r);
                  box-shadow: 0 0 0 100px #fff; }
    .rhome { top: var(--frame); left: var(--frame); }
    body { padding: var(--frame); box-sizing: border-box; }
    /* ---------- header: a white tab hanging from the top of the frame (after supaste.com's black one) ----------
       rounded underneath, with curved fillets where it meets the frame; only as wide as what's in it, centred */
    .tab { --tab-h: 52px; --tab-r: 14px; position: fixed; z-index: 1001; top: var(--frame, 8px); left: 50%; transform: translateX(-50%); max-width: calc(100% - 2 * var(--frame, 8px) - 36px);
           height: var(--tab-h); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; background: #fff; color: #111;
           border-radius: 0 0 var(--tab-r) var(--tab-r); font-family: -apple-system, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif; }
    .tab::before, .tab::after { content: ''; position: absolute; top: 0; width: var(--tab-r); height: var(--tab-r); pointer-events: none; }
    .tab::before { right: 100%; background: radial-gradient(circle at 0 100%, transparent calc(var(--tab-r) - 0.5px), #fff var(--tab-r)); }
    .tab::after  { left: 100%;  background: radial-gradient(circle at 100% 100%, transparent calc(var(--tab-r) - 0.5px), #fff var(--tab-r)); }
    .tab a { color: inherit; text-decoration: none; }
    .tab-brand { position: relative; display: flex; align-items: center; gap: 10px; height: 100%; flex: none; }
    .tab-r { width: 32px; height: 32px; border-radius: 50%; background: #e5ab00; color: #111; display: grid; place-items: center;
             font: 700 20px/1 -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; letter-spacing: -0.03em; padding-top: 1px; }
    .tab-name { font: 600 15px/1 -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; letter-spacing: -0.01em; white-space: nowrap; }
    .tab-links { display: flex; align-items: center; gap: 2px; margin-left: 16px; }
    .tab-links a, .tab-drop a { font: 500 14.5px/1 -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; color: rgba(17,17,17,0.52); padding: 9px 10px; border-radius: 8px;
             transition: color .15s, background .15s; white-space: nowrap; }
    .tab-links a:hover, .tab-drop a:hover { color: #111; background: rgba(17,17,17,0.05); }
    .tab-links a[aria-current="page"], .tab-drop a[aria-current="page"] { color: #111; }
    .tab-cta { margin-left: 14px; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 9px; background: #111; color: #fff !important;
               font: 600 14px/1 -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; white-space: nowrap; transition: background .15s; }
    .tab-cta:hover { background: #2a2a2a; }
    .tab-cta svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
    .tab a:focus-visible, .tab button:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
    .tab-menu { display: none; -webkit-appearance: none; appearance: none; width: 36px; height: 36px; border: 0; border-radius: 9px; background: rgba(17,17,17,0.06); cursor: pointer; place-items: center; }
    .tab-menu i, .tab-menu i::before, .tab-menu i::after { display: block; width: 16px; height: 1.6px; background: #111; border-radius: 1px; position: relative; transition: transform .25s, top .25s, background .2s; }
    .tab-menu i::before, .tab-menu i::after { content: ''; position: absolute; left: 0; } .tab-menu i::before { top: -5px; } .tab-menu i::after { top: 5px; }
    .tab.open .tab-menu i { background: transparent; } .tab.open .tab-menu i::before { top: 0; transform: rotate(45deg); } .tab.open .tab-menu i::after { top: 0; transform: rotate(-45deg); }
    .tab-drop { position: absolute; top: calc(100% + 8px); right: 0; min-width: 190px; padding: 6px; background: #fff; border-radius: 14px; display: grid;
                box-shadow: 0 12px 32px -8px rgba(0,0,0,0.35); opacity: 0; visibility: hidden; transform: translateY(-6px);
                transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1), visibility 0s linear .25s; }
    .tab-drop a { padding: 12px 12px; font-size: 15px; }
    .tab.open .tab-drop { opacity: 1; visibility: visible; transform: none; transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1), visibility 0s; }
    @media (max-width: 760px){
      .tab { --tab-h: 50px; --tab-r: 12px; }
      .tab-links { display: none; } .tab-menu { display: grid; } .tab-cta { margin-left: 12px; }
    }
    @media (max-width: 380px){ .tab-name { display: none; } }
  </style>
</head>

  <script>
    document.getElementById('yr').textContent=new Date().getFullYear();

    var TZ='America/New_York', LAT=40.8164, LON=-73.9175;
    var $=function(id){ return document.getElementById(id); };
    // local time, every second
    function tick(){ var d=new Date(), p=new Intl.DateTimeFormat('en-US',{ timeZone:TZ, hour:'numeric', minute:'2-digit' }).formatToParts(d);
      var hm=p.filter(function(x){ return x.type==='hour'||x.type==='minute'||(x.type==='literal'&&x.value===':'); }).map(function(x){ return x.value; }).join('');
      var ap=(p.find(function(x){ return x.type==='dayPeriod'; })||{}).value||'';
      $('clock').innerHTML=hm+'<small>'+ap+'</small>';
      $('date').textContent=new Intl.DateTimeFormat('en-US',{ timeZone:TZ, weekday:'long', month:'long', day:'numeric' }).format(d); }
    tick(); setInterval(tick, 1000);

    // weather
    var LABEL=function(c){ return c===0?'Clear': c===1?'Mostly clear': c===2?'Partly cloudy': c===3?'Overcast': (c===45||c===48)?'Fog': (c>=51&&c<=57)?'Drizzle':
      (c>=61&&c<=67)?'Rain': (c>=71&&c<=77)?'Snow': (c>=80&&c<=82)?'Showers': (c===85||c===86)?'Snow showers': c>=95?'Thunderstorm':'—'; };
    var ICON=function(c,day){ var sun='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
        moon='<svg viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg>',
        cloud='<svg viewBox="0 0 24 24"><path d="M7 18.5h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.4A3.3 3.3 0 0 0 7 18.5z"/></svg>',
        rain='<svg viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.4A3.3 3.3 0 0 0 7 15z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/></svg>',
        snow='<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>';
      return c<=1?(day?sun:moon): ((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95)?rain: ((c>=71&&c<=77)||c===85||c===86)?snow: cloud; };
    function load(){
      var url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
        '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day'+
        '&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=2'+
        '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York';
      var ctl=new AbortController(), to=setTimeout(function(){ ctl.abort(); }, 8000);
      fetch(url,{ signal:ctl.signal }).then(function(r){ clearTimeout(to); if (!r.ok) throw 0; return r.json(); }).then(function(j){
        document.body.classList.remove('off'); var c=j.current;
        $('temp').textContent=Math.round(c.temperature_2m)+'°'; $('icon').innerHTML=ICON(c.weather_code,c.is_day);
        $('cond').textContent=LABEL(c.weather_code);
        $('feels').textContent=Math.round(c.apparent_temperature)+'°';
        $('hilo').textContent=Math.round(j.daily.temperature_2m_max[0])+'° / '+Math.round(j.daily.temperature_2m_min[0])+'°';
        $('hum').textContent=Math.round(c.relative_humidity_2m)+'%'; $('wind').textContent=Math.round(c.wind_speed_10m)+' mph';
        var now=c.time.slice(0,13), i=Math.max(0,j.hourly.time.findIndex(function(t){ return t.slice(0,13)===now; })), h='';
        for (var k=i;k<i+12&&k<j.hourly.time.length;k++){ var hr=+j.hourly.time[k].slice(11,13), lab=k===i?'Now':((hr%12)||12)+(hr<12?'a':'p');
          h+='<div class="hr"><span>'+lab+'</span>'+ICON(j.hourly.weather_code[k],j.hourly.is_day[k])+'<b>'+Math.round(j.hourly.temperature_2m[k])+'°</b></div>'; }
        $('hours').innerHTML=h;
        $('note').textContent='Updated '+new Intl.DateTimeFormat('en-US',{ timeZone:TZ, hour:'numeric', minute:'2-digit' }).format(new Date())+' · refreshes every 10 minutes.';
      }).catch(function(){ document.body.classList.add('off');
        $('cond').textContent="Couldn't reach the weather service from here."; $('note').textContent='The local time above is live; the weather will fill in when the service is reachable.'; });
    }
    load(); setInterval(load, 600000);
  </script>
  <script>
    /* header: the phone menu (opens under the tab; Escape or a tap elsewhere closes it) */
    (function(){ var t=document.getElementById('rnav'), b=document.getElementById('rnavToggle');
      function set(o){ t.classList.toggle('open',o); b.setAttribute('aria-expanded',o); b.setAttribute('aria-label',o?'Close menu':'Menu'); }
      b.addEventListener('click', function(){ set(!t.classList.contains('open')); });
      document.addEventListener('keydown', function(e){ if (e.key==='Escape' && t.classList.contains('open')){ set(false); b.focus(); } });
      document.addEventListener('pointerdown', function(e){ if (t.classList.contains('open') && !t.contains(e.target)) set(false); });
      t.querySelectorAll('.tab-drop a').forEach(function(a){ a.addEventListener('click', function(){ set(false); }); });
    })();
  </script>
</body>
